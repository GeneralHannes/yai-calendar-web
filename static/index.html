<script>
// ---- Odin's Keep motion helpers (shared, identical in all three apps) ----
// dismiss(): play an overlay's exit before removing it. The id is dropped at
// once, so code that reopens the same dialog never finds the leaving copy.
const K_REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
function dismiss(el, ms){
  if(!el || el.dataset.kLeaving) return;
  el.dataset.kLeaving='1'; el.removeAttribute('id'); el.style.pointerEvents='none';
  if(K_REDUCED.matches){ el.remove(); return; }
  el.classList.add('k-leaving'); setTimeout(()=>el.remove(), ms||230);
}
// kThumb(): a segmented control's highlight slides to the active option
// instead of jumping. Any element with data-k-thumb gets one; a
// MutationObserver follows the .active class, so call sites don't change.
function kThumb(box){
  let th=box.querySelector(':scope > .k-thumb');
  const line=box.dataset.kThumb==='line';
  if(!th){
    th=document.createElement('span'); th.className='k-thumb'+(line?' k-line':''); box.prepend(th);
    box.classList.add('k-thumbed');
    new MutationObserver(ms=>{ if(ms.some(m=>m.target!==th)) requestAnimationFrame(()=>kThumb(box)); })
      .observe(box,{subtree:true,attributes:true,attributeFilter:['class','style','aria-current']});
    // also re-measure when the control itself appears or resizes (a tab that was hidden at load)
    if(window.ResizeObserver) new ResizeObserver(()=>kThumb(box)).observe(box);
  }
  const act=box.querySelector(':scope > .active, :scope > [aria-current="page"]');
  // read every measurement first, then write: interleaving them forces a fresh layout per read
  const w=act?act.offsetWidth:0, h=w?act.offsetHeight:0, x=w?act.offsetLeft:0, y=w?act.offsetTop:0;
  if(!w){ th.style.opacity='0'; return; }
  const inset=line?10:0, first=!box.classList.contains('k-ready');
  if(first) th.style.transition='none';
  th.style.width=(w-2*inset)+'px';
  if(!line) th.style.height=h+'px';
  th.style.transform=`translate(${x+inset}px,${line?y+h-5:y}px)`;
  th.style.opacity='1';
  // first placement lands without sliding; transitions come back after it has painted (no forced layout)
  if(first){ box.classList.add('k-ready'); requestAnimationFrame(()=>requestAnimationFrame(()=>{ th.style.transition=''; })); }
}
function kThumbs(){ document.querySelectorAll('[data-k-thumb]').forEach(kThumb); }
addEventListener('resize', ()=>kThumbs());
addEventListener('load', ()=>kThumbs());
if(document.fonts) document.fonts.ready.then(()=>kThumbs());

"use strict";
const $ = s => document.querySelector(s);
const esc = s => (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- auth: optional PIN (JOURNAL_TOKEN on the server), remembered on this device. ----
let TOKEN = new URLSearchParams(location.search).get('token') || localStorage.getItem('sk_token') || '';
if(TOKEN){ try{ localStorage.setItem('sk_token', TOKEN); }catch(_){} }

let toastT=0;
function toast(msg, ms=2000){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }

// ---- where the data lives: ONE setting, so the backend can be swapped ----
// JR_API is the backend's address ('' = the server this page came from, or on a static host with no
// server, this device only). It comes from, in order:
//   1. ?api=https://… in the link (remembered on this device; ?api=reset forgets it),
//   2. static/config.json  {"api": "https://…"}  — what `bun run public` writes for the GitHub site,
//   3. nothing: ''.
let JR_API='';
async function jrResolveApi(){
  try{
    const q=new URLSearchParams(location.search).get('api');
    if(q==='reset') localStorage.removeItem('journal_api');
    else if(q) localStorage.setItem('journal_api', q.replace(/\/+$/,''));
    const kept=localStorage.getItem('journal_api');
    if(kept){ JR_API=kept; return; }
  }catch(_){}
  try{
    const r=await fetch('static/config.json?'+Date.now(), {cache:'no-store'});
    if(r.ok){ const c=await r.json(); JR_API=(c.api||'').trim().replace(/\/+$/,''); }
  }catch(_){}
}
const jrUrl = path => JR_API + path;

// ---- frozen copy: the last events this device loaded, kept so nothing recorded ever disappears ----
// When the backend can't be reached (switched off, moved, no signal) the calendar shows this copy,
// read-only, until the backend answers again.
const JR_SNAP_KEY='journal_snapshot';
let JR_FROZEN=false;
function jrSaveSnapshot(events){ try{ localStorage.setItem(JR_SNAP_KEY, JSON.stringify({at:new Date().toISOString(), api:JR_API, events})); }catch(_){} }
// only the copy taken from the backend in use now: never show one backend's events as another's
function jrSnapshot(){ try{ const s=JSON.parse(localStorage.getItem(JR_SNAP_KEY)); return s && s.api===JR_API ? s : null; }catch(_){ return null; } }
function jrFreeze(on){
  if(JR_FROZEN===on) return;
  JR_FROZEN=on;
  document.body.classList.toggle('jr-frozen', on);
  let b=document.getElementById('jr-frozen-bar');
  if(on){
    const s=jrSnapshot(), when=s?.at?new Date(s.at).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}):null;
    if(!b){ b=document.createElement('div'); b.id='jr-frozen-bar'; b.setAttribute('role','status'); document.body.appendChild(b); }
    b.innerHTML=`<b>Server offline</b> · ${when?`showing the copy saved ${esc(when)}`:'nothing saved on this device yet'} · changes are paused`;
  } else if(b){ b.classList.add('leaving'); setTimeout(()=>b.remove(), 260); toast('Back online'); }
}
class JrOffline extends Error {}

async function api(path, opts={}){
  const method=(opts.method||'GET').toUpperCase();
  if(JR_FROZEN && method!=='GET'){ toast('Server offline — changes are paused'); throw new JrOffline('offline'); }
  opts.headers = Object.assign({}, opts.headers||{}, TOKEN?{'X-Token':TOKEN}:{});
  let r;
  try{ r = await fetch(jrUrl(path), opts); }
  catch(e){ throw new JrOffline('cannot reach the server'); }        // network down, server or tunnel gone
  if(r.status>=502 && r.status<=530) throw new JrOffline('server offline (HTTP '+r.status+')');   // the tunnel answers, the server doesn't
  if(r.status===401){ jrSetSession('', null); askToken(); throw new Error('please sign in'); }
  if(r.status===429){ toast('Too many wrong PINs — try again in 15 minutes'); throw new Error('locked out for a while'); }
  if(!r.ok){ let d; try{ d=(await r.json()).detail; }catch(_){} throw new Error(d || r.statusText); }
  return r.json();
}
// Every event read goes through here: fresh from the backend (and saved as the frozen copy), or, if the
// backend can't be reached, the frozen copy.
async function jrFetchEvents(){
  try{
    const events=await api('/api/journal/events');
    jrSaveSnapshot(events); jrFreeze(false);
    return events;
  }catch(e){
    if(!(e instanceof JrOffline)) throw e;
    jrFreeze(true);
    return jrSnapshot()?.events || JOURNAL_EVENTS || [];
  }
}
// ---- signing in ----
// The backend says (GET /api/auth) whether it has accounts. With accounts: a username/password screen, with
// "Create account" (needs the team code if the server has one); the session token then goes out as X-Token,
// where the old shared PIN went. Without accounts: the PIN screen below, as before.
let JR_AUTH=null;                                                     // what /api/auth said
let JR_USER=(()=>{ try{ return JSON.parse(localStorage.getItem('yai_user')); }catch(_){ return null; } })();
async function jrAuthInfo(){ if(JR_AUTH) return JR_AUTH; try{ JR_AUTH=await (await fetch(jrUrl('/api/auth'))).json(); }catch(_){ JR_AUTH={required:false}; } return JR_AUTH; }
function jrSetSession(token, user){
  TOKEN=token||''; JR_USER=user||null;
  try{ token?localStorage.setItem('sk_token',token):localStorage.removeItem('sk_token');
       user?localStorage.setItem('yai_user',JSON.stringify(user)):localStorage.removeItem('yai_user'); }catch(_){}
  // sign in once per device: sessions don't expire, and this asks the browser never to clear the app's storage
  if(token) try{ navigator.storage?.persist?.(); }catch(_){}
  jrRenderMe();
}
function jrRenderMe(){
  const el=document.getElementById('jr-me'); if(!el) return;
  el.innerHTML=JR_USER?`<span>${esc(JR_USER.name)}</span><button type="button" class="mini" onclick="jrSignOut()">Sign out</button>`:'';
}
async function jrSignOut(){
  if(!await askConfirm('Sign out on this device?')) return;
  try{ await fetch(jrUrl('/api/logout'),{method:'POST',headers:{'X-Token':TOKEN}}); }catch(_){}
  jrSetSession('', null); JOURNAL_EVENTS=[]; jrRender(); askToken();
}
function jrSignIn(){
  if(document.getElementById('pin-ov')) return;
  const ov=document.createElement('div'); ov.id='pin-ov'; ov.className='jr-signin';
  let mode='in';
  const draw=()=>{
    const up=mode==='up';
    ov.innerHTML=`<form class="jr-signin-card" autocomplete="on">
      <img src="/static/icon-192.png" class="jr-signin-mark" alt="">
      <h2>${up?'Create account':'Sign in'}</h2>
      <p class="muted">${up?'Your username is shown on the events you add.':'Yai Calendar, shared with your team.'}</p>
      <label class="field"><span>Username</span><input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="32"></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="${up?'new-password':'current-password'}"></label>
      ${up&&JR_AUTH?.team_code?`<label class="field"><span>Team code</span><input name="code" inputmode="numeric" autocomplete="off"></label>`:''}
      <button class="act" type="submit">${up?'Create account':'Sign in'}</button>
      <div class="jr-signin-err" role="alert"></div>
      <button class="jr-signin-switch" type="button">${up?'I already have an account':'New here? Create an account'}</button>
    </form>`;
    const f=ov.querySelector('form'), errEl=ov.querySelector('.jr-signin-err'), go=f.querySelector('[type=submit]');
    ov.querySelector('.jr-signin-switch').onclick=()=>{ mode=up?'in':'up'; draw(); };
    f.onsubmit=async e=>{
      e.preventDefault();
      const v=Object.fromEntries(new FormData(f));
      if(!v.username||!v.password){ errEl.textContent='Fill in your username and password'; return; }
      go.disabled=true; errEl.textContent='';
      try{
        const r=await fetch(jrUrl(up?'/api/signup':'/api/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});
        const d=await r.json().catch(()=>({}));
        if(!r.ok){ errEl.textContent=r.status===429?'Too many wrong tries — wait 15 minutes':(d.detail||'Something went wrong'); go.disabled=false; return; }
        jrSetSession(d.token, d.user); dismiss(ov); toast(`Signed in as ${d.user.name}`); loadJournal();
      }catch(_){ errEl.textContent='Can’t reach the calendar — try again'; go.disabled=false; }
    };
    setTimeout(()=>{ try{ f.querySelector('input').focus(); }catch(_){} }, 60);
  };
  draw(); document.body.appendChild(ov);
}

// On-page PIN screen (NOT a native prompt — iOS home-screen web apps block prompt()/alert()).
async function askToken(){
  if(document.getElementById('pin-ov')) return;
  if((await jrAuthInfo()).accounts) return jrSignIn();
  if(document.getElementById('pin-ov')) return;
  const ov=document.createElement('div'); ov.id='pin-ov';
  ov.style.cssText='position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;'
    +'background:var(--bg);padding:1.5rem;animation:fadeIn .2s ease both';
  ov.innerHTML='<div style="width:100%;max-width:17rem;text-align:center">'
    +'<img src="/static/icon-192.png" alt="" style="width:3.4rem;height:3.4rem;border-radius:22%;margin-bottom:.6rem">'
    +'<h2 style="margin:0 0 1rem;font-size:1.15rem;font-weight:700">Enter PIN</h2>'
    +'<input id="pin-inp" type="tel" inputmode="numeric" autocomplete="off" placeholder="PIN" '
    +'style="font-size:1.5rem;text-align:center;letter-spacing:.35em">'
    +'<button class="act" id="pin-go" style="margin-top:.75rem;width:100%">Unlock</button>'
    +'<div id="pin-err" style="margin-top:.55rem;color:var(--warn);font-size:.85rem;min-height:1.1em"></div></div>';
  document.body.appendChild(ov);
  const inp=ov.querySelector('#pin-inp'), go=ov.querySelector('#pin-go'), err=ov.querySelector('#pin-err');
  const submit=async()=>{ const pin=(inp.value||'').trim(); if(!pin) return;
    go.disabled=true; err.textContent='Checking…';
    try{
      const r=await fetch(jrUrl('/api/journal/events'),{headers:{'X-Token':pin}});
      if(r.status===429){ err.textContent='Too many wrong tries — wait 15 minutes'; go.disabled=false; return; }
      if(!r.ok){ err.textContent='Wrong PIN — try again'; inp.value=''; inp.focus(); go.disabled=false; return; }
      TOKEN=pin; try{ localStorage.setItem('sk_token',pin); }catch(_){}
      dismiss(ov); loadJournal();
    }catch(e){ err.textContent='Connection problem — try again'; go.disabled=false; }
  };
  go.onclick=submit;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
  setTimeout(()=>{ try{ inp.focus(); }catch(_){} }, 60);
}
async function checkAuth(){
  const a=await jrAuthInfo();
  if(a.accounts && TOKEN && !JR_USER){                                // signed in before names were kept on the device
    try{ const r=await fetch(jrUrl('/api/me'),{headers:{'X-Token':TOKEN}}); if(r.ok) jrSetSession(TOKEN,(await r.json()).user); }catch(_){}
  }
  jrRenderMe();
  if(a.required && !TOKEN) askToken();
}

// On-page confirm/prompt replacements.
function askConfirm(msg){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;'
      +'background:rgba(0,0,0,.5);padding:1.5rem;animation:fadeIn .15s ease both';
    ov.innerHTML='<div style="width:100%;max-width:20rem;background:var(--bg);border:1px solid var(--line);'
      +'border-radius:12px;padding:1.1rem;box-shadow:0 10px 30px rgba(0,0,0,.35)">'
      +'<div style="font-size:.98rem;line-height:1.4;margin-bottom:1rem;white-space:pre-wrap">'+esc(msg)+'</div>'
      +'<div style="display:flex;gap:.5rem"><button class="mini" id="ac-no" style="flex:1">Cancel</button>'
      +'<button class="act" id="ac-yes" style="flex:1">OK</button></div></div>';
    document.body.appendChild(ov);
    const done=v=>{ document.removeEventListener('keydown',onKey); dismiss(ov); resolve(v); };
    const onKey=e=>{ if(e.key==='Escape') done(false); };
    ov.querySelector('#ac-no').onclick=()=>done(false);
    ov.querySelector('#ac-yes').onclick=()=>done(true);
    ov.onclick=e=>{ if(e.target===ov) done(false); };
    document.addEventListener('keydown', onKey);
    setTimeout(()=>{ try{ ov.querySelector('#ac-yes').focus(); }catch(_){} }, 30);
  });
}

// =================== Yai Calendar ===================
let JOURNAL_EVENTS = [];
let JR_VIEW = localStorage.getItem('sk_journal_view') || 'calendar';
let JR_CAL_YEAR, JR_CAL_MONTH; // 0-based month, like Date's own convention
(function(){ const d=new Date(); JR_CAL_YEAR=d.getFullYear(); JR_CAL_MONTH=d.getMonth(); })();
let JR_SEL = null;   // the selected day (ISO); the bottom panel shows only this day

const jrToday = () => jrISO(new Date());
// Local-calendar-day ISO string — never toISOString(), which is UTC and can
// land on the wrong day near midnight in this timezone.
function jrISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// en-GB dates by hand, the same text the browser gives: every toLocaleDateString call builds a
// formatter (the clock alone asked for three a second) and the first one loads the Intl engine.
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const p2=n=>String(n).padStart(2,'0');
const dayMonthYear=d=>`${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;   // 10 October 2026
function jrDayLabel(iso){
  const today=jrToday();
  if(iso===today) return '<span class="rel">Today</span>';
  const t=new Date(today+'T00:00:00'), d=new Date(iso+'T00:00:00');
  const diffDays=Math.round((d-t)/86400000);
  if(diffDays===1) return '<span class="rel">Tomorrow</span>';
  if(diffDays===-1) return '<span class="rel">Yesterday</span>';
  return `${DAY_NAMES[d.getDay()].slice(0,3)} ${d.getDate()} ${MON[d.getMonth()]}`;   // Sat 10 Oct
}
function jrTimeLabel(t){ return t ? t.slice(0,5) : '—'; }
// for the day squares, where every letter counts: "09:30:00" → "9:30"
function jrShortTime(t){ return t ? t.slice(0,5).replace(/^0(\d)/,'$1') : ''; }
// An event can run from a time to a time, and over several days (end_date). These say where it ends and
// how to write its span; every view uses them, so a multi-day event shows on each day it covers.
const jrEnd=e=>e.end_date && e.end_date>e.event_date ? e.end_date : e.event_date;   // its last day
const jrCovers=(e,iso)=>e.event_date<=iso && iso<=jrEnd(e);
const jrMulti=e=>jrEnd(e)!==e.event_date;
// "9:30–11:00" (short: no leading zero), "" when all day
function jrTimeRange(e, short){
  if(!e.event_time) return '';
  const f=short?jrShortTime:jrTimeLabel;
  return f(e.event_time)+(e.end_time?'–'+f(e.end_time):'');
}
// "20–23 Nov", or "30 Nov – 2 Dec" across months
function jrDateRange(e){
  const a=new Date(e.event_date+'T00:00:00'), b=new Date(jrEnd(e)+'T00:00:00');
  return a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear()
    ? `${a.getDate()}–${b.getDate()} ${MON[a.getMonth()]}` : `${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}`;
}
const jrDays=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
function jrAddDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return jrISO(d); }
// A multi-day event's details on one day: that day's own, else the event's (a field left out is the event's)
function jrDay(e, iso){
  const o=e.day_info?.[iso]||{}, t=o.event_time||e.event_time||null; let t2=o.end_time||e.end_time||null;
  if(t2 && (!t || t2<=t)) t2=null;                                  // an end that no longer follows its start is dropped
  return {event_time:t, end_time:t2, location:o.location||e.location||null, notes:o.notes||e.notes||null};
}
// the same details moved n days (the whole event dragged, or its dates shifted in the form)
function jrShiftDays(di, n){ const o={}; for(const k in di||{}) o[jrAddDays(k,n)]=di[k]; return o; }
// A place opens in Google Maps (the Maps app on a phone that has it): a pasted Maps link as it is, a place name
// as a Maps search. A link shows as "Map" rather than as a long address.
const jrIsLink=loc=>/^https?:\/\//i.test(loc||'');
const jrMapUrl=loc=>jrIsLink(loc) ? loc : 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc);
const jrPlace=loc=>jrIsLink(loc) ? 'Map' : loc;
function jrMapLink(loc, cls=''){
  return `<a class="jr-map ${cls}" href="${esc(jrMapUrl(loc))}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open in Google Maps">${JR_PIN}${esc(jrPlace(loc))}</a>`;
}
const JR_PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>';

// The month and the day are drawn straight away; the events fill in when they arrive, so a slow or
// failed load never leaves an empty screen.
async function loadJournal(){
  if(!JR_SEL) JR_SEL=jrToday();
  const first=!document.querySelector('#jr-cal-grid').children.length && !document.querySelector('#jr-agenda-list .jr-day-group');
  if(first) setJournalView(JR_VIEW, true);
  let live=false;
  try{ JOURNAL_EVENTS = await jrFetchEvents(); live=!JR_FROZEN; }
  catch(e){ if(e.message!=='please sign in') toast('Error loading events: '+e.message); JOURNAL_EVENTS=jrSnapshot()?.events || []; }
  if(!first) setJournalView(JR_VIEW, true);
  else if(JR_VIEW==='calendar') renderCalendar({enter:true});   // the day's cards deal in as they arrive
  else renderAgenda();
  if(live) jrOfferLocalEvents();   // only once the backend has really answered (past the PIN)
}
function setJournalView(v, skipSave){
  const from=JR_VIEW; JR_VIEW=v;
  if(!skipSave) try{ localStorage.setItem('sk_journal_view', v); }catch(_){}
  $('#jr-view-agenda-btn').classList.toggle('active', v==='agenda');
  $('#jr-view-calendar-btn').classList.toggle('active', v==='calendar');
  $('#jr-agenda').style.display = v==='agenda' ? '' : 'none';
  $('#jr-calendar').style.display = v==='calendar' ? '' : 'none';
  // Odin's Keep's tab motion: the view comes in from the side of the button you came from
  // (Agenda sits below Calendar in the side menu, so it rises up; Calendar drops down)
  if(from!==v && !skipSave){
    const el=$(v==='agenda'?'#jr-agenda':'#jr-calendar');
    el.classList.remove('vin-u','vin-d'); void el.offsetWidth; el.classList.add(v==='agenda'?'vin-u':'vin-d');
  }
  document.body.classList.toggle('jr-cal-view', v==='calendar');
  if(v==='agenda') renderAgenda(); else renderCalendar({wave:true, enter:true});
}
function jrRender(){ if(JR_VIEW==='agenda') renderAgenda(); else renderCalendar(); }

// Desktop side menu: everything from today on, in date order, under month and day headings — the Agenda in
// brief. Clicking one opens that day in the calendar. (Phones hide it: there the menu is a bar.)
let JR_UPNEXT_SIG='';
function jrRenderUpNext(){
  const box=document.getElementById('jr-upnext'); if(!box) return;
  const today=jrToday();
  // listed under its first day, or under today while it's still running
  const at=e=>e.event_date<today?today:e.event_date;
  const evs=JOURNAL_EVENTS.filter(e=>jrEnd(e)>=today)
    .sort((a,b)=>at(a).localeCompare(at(b)) || jrMulti(b)-jrMulti(a) || jrByTime(a,b)).slice(0,60);
  const sig=JSON.stringify([today,JR_SEL,evs]); if(sig===JR_UPNEXT_SIG) return; JR_UPNEXT_SIG=sig;   // nothing new: leave it be
  if(!evs.length){ box.innerHTML='<div class="jr-up-head">Coming up</div><div class="jr-up-empty">Nothing planned yet.</div>'; return; }
  let html='<div class="jr-up-head">Coming up</div>', month='', day='', n=0;
  for(const e of evs){
    const iso=at(e), d=new Date(iso+'T00:00:00'), m=`${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
    if(m!==month){ month=m; html+=`<div class="jr-up-month">${esc(m)}</div>`; }
    if(iso!==day){
      day=iso;
      const rel=iso===today?'Today':(Math.round((d-new Date(today+'T00:00:00'))/86400000)===1?'Tomorrow':'');
      html+=`<div class="jr-up-day${day===JR_SEL?' sel':''}" style="--i:${n}"><b>${d.getDate()}</b><span>${DAY_NAMES[d.getDay()].slice(0,3)}${rel?` · <em>${rel}</em>`:''}</span></div>`;
    }
    const more=[jrMulti(e)?`<em>${jrDateRange(e)}</em>`:'', e.location?`<span class="jr-up-loc" role="link" title="Open in Google Maps" onclick="event.stopPropagation();open(jrMapUrl(${esc(JSON.stringify(e.location))}),'_blank','noopener')">${JR_PIN}${esc(jrPlace(e.location))}</span>`:'',
      e.category?`<i>${esc(e.category)}</i>`:'', e.created_by?`<b>${esc(e.created_by)}</b>`:'', e.notes?esc(e.notes):''].filter(Boolean).join('');
    html+=`<button type="button" class="jr-up-ev${e.done?' done':''}" style="--i:${n++}" onclick="jrUpOpen('${iso}',${e.id})">
      <span class="jr-up-time">${jrTimeRange(e,true)||(jrMulti(e)?'Days':'All day')}</span>
      <span class="jr-up-title">${esc(e.title)}</span>
      ${more?`<span class="jr-up-more">${more}</span>`:''}
    </button>`;
  }
  box.innerHTML=html;
}
function jrUpOpen(iso, id){
  if(JR_VIEW!=='calendar') setJournalView('calendar');
  calSelect(iso);
  if(!K_REDUCED.matches) requestAnimationFrame(()=>document.querySelector(`.jr-dcard[data-id="${id}"]`)?.classList.add('flash'));
}

function renderAgenda(){
  jrRenderUpNext();
  const showPast = $('#jr-show-past')?.checked;
  const today = jrToday();
  const events = JOURNAL_EVENTS.filter(e => showPast || jrEnd(e) >= today);
  const box = $('#jr-agenda-list');
  if(!events.length){ box.innerHTML = '<div class="empty">'+(showPast?'No events yet.':'Nothing planned.')+'<span class="muted">Tap “Add event” to put something on it.</span></div>'; return; }
  const groups = {};
  for(const e of events){ (groups[e.event_date] = groups[e.event_date] || []).push(e); }
  const dates = Object.keys(groups).sort();
  box.innerHTML = dates.map(date => `
    <div class="jr-day-group" data-iso="${date}">
      <div class="jr-day-head">${jrDayLabel(date)}</div>
      <div class="jr-table">
        <div class="jr-h">Time</div><div class="jr-h">Title</div><div class="jr-h jr-h-cat">Category</div><div class="jr-h"></div><div class="jr-h"></div>
        ${groups[date].map(e => `
          <div class="jr-row${e.done?' done':''}" style="display:contents">
            <div class="jr-cell jr-time" onclick="editEventTime(${e.id})">${jrTimeRange(e)||'—'}</div>
            <div class="jr-cell jr-title" style="flex-direction:column;align-items:flex-start;white-space:normal">
              <div onclick="editEventTitle(${e.id})">${esc(e.title)}</div>
              ${jrMulti(e)||e.location?`<div class="jr-ag-where">${jrMulti(e)?`<b onclick="event.stopPropagation();editEventWhen(${e.id},'#ae-end-date')">${jrDateRange(e)}</b>`:''}${e.location?jrMapLink(e.location):''}</div>`:''}
              <div class="muted jr-notes-txt" style="font-size:.75rem" onclick="event.stopPropagation();editEventNotes(${e.id})">${e.notes?esc(e.notes):'+ note'}</div>
              ${e.created_by?`<div class="jr-by">by ${esc(e.created_by)}</div>`:''}
              <div class="jr-cat-m" onclick="event.stopPropagation();editEventCategory(${e.id})">${e.category?`<span class="chip-lbl">${esc(e.category)}</span>`:'<span class="muted">+ tag</span>'}</div>
            </div>
            <div class="jr-cell jr-cat" onclick="editEventCategory(${e.id})">${e.category?`<span class="chip-lbl">${esc(e.category)}</span>`:'<span class="muted">+ tag</span>'}</div>
            <div class="jr-cell jr-check${e.done?' done':''}" onclick="toggleEventDone(${e.id})" title="${e.done?'Mark not done':'Mark done'}">${e.done?'✓':'○'}</div>
            <div class="jr-cell jr-del" onclick="deleteEventRow(${e.id})" title="Delete">✕</div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

// A card folding shut: fades, slides right and closes its gap, then the caller re-renders.
function jrFold(el){
  if(!el || !el.animate || K_REDUCED.matches) return Promise.resolve();
  el.classList.add('leaving');
  // a day card sits in a row, so it folds sideways; an agenda row folds up
  if(el.closest('.jr-day-list')){
    const w=el.offsetWidth;
    return el.animate([{opacity:1,transform:'none',maxWidth:w+'px',flexBasis:w+'px'},
      {opacity:0,transform:'translateY(18px) scale(.94)',maxWidth:w+'px',flexBasis:w+'px',offset:.55},
      {opacity:0,transform:'translateY(18px) scale(.94)',maxWidth:'0px',flexBasis:'0px',paddingLeft:'0px',paddingRight:'0px',marginRight:'-.55rem',borderWidth:'0px'}],
      {duration:340,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished.catch(()=>{});
  }
  const h=el.offsetHeight;
  return el.animate([{opacity:1,transform:'none',height:h+'px'},{opacity:0,transform:'translateX(24px)',height:h+'px',offset:.55},
    {opacity:0,transform:'translateX(24px)',height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'-.55rem',borderWidth:'0px'}],
    {duration:340,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished.catch(()=>{});
}
function jrEvent(id){ return JOURNAL_EVENTS.find(e=>e.id===id); }
function editEventTime(id){ openAddEvent(null, id, '#ae-time'); }
// every part of an event edits in the one form, opened at the part that was tapped
function editEventTitle(id){ openAddEvent(null, id, '#ae-title'); }
function editEventNotes(id){ openAddEvent(null, id, '#ae-notes'); }
function editEventCategory(id){ openAddEvent(null, id, '#ae-cat'); }
async function toggleEventDone(id){
  const e=jrEvent(id); if(!e || jrJustSwiped()) return;
  try{
    const updated=await api('/api/journal/events/'+id+'/done',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:!e.done})});
    const i=JOURNAL_EVENTS.findIndex(x=>x.id===id); if(i>=0) JOURNAL_EVENTS[i]=updated;
    jrRender();
    if(updated.done && !K_REDUCED.matches){
      const c=document.querySelector(`.jr-dcard[data-id="${id}"]`);
      c?.querySelector('.ok')?.classList.add('tick'); c?.classList.add('just-done');
    }
  }catch(err){ toast('Error: '+err.message); }
}
async function deleteEventRow(id){
  const e=jrEvent(id); if(!e || jrJustSwiped()) return;
  if(!await askConfirm('Delete "'+e.title+'"?')) return;
  try{
    await api('/api/journal/events/'+id,{method:'DELETE'});
    await jrFold(document.querySelector(`.jr-dcard[data-id="${id}"]`));
    JOURNAL_EVENTS = JOURNAL_EVENTS.filter(x=>x.id!==id);
    jrRender();
    toast('Deleted');
  }catch(err){ toast('Error: '+err.message); }
}

// Add an event, or (with an id) change one: the same form, with from–to dates, from–to times and a place.
// "To" is optional in both: no end date is a one-day event, no end time is a moment.
// A multi-day event also gets a tab for each of its days: a day's own times, place and notes (empty = the event's).
// Opened from a day of the calendar it starts on that day's tab, unless the title, dates or category were tapped.
async function openAddEvent(prefillDate, id, focus, day){
  if(JR_FROZEN){ toast('Server offline — changes are paused'); return; }
  const ev=id?jrEvent(id):null; if(id && !ev) return;
  const PERDAY={'#ae-time':'#ad-time','#ae-end-time':'#ad-end-time','#ae-loc':'#ad-loc','#ae-notes':'#ad-notes'};
  if(day===undefined) day = ev && jrMulti(ev) && JR_VIEW==='calendar' && JR_SEL && jrCovers(ev,JR_SEL) && (!focus || PERDAY[focus]) ? JR_SEL : null;
  const days=JSON.parse(JSON.stringify(ev?.day_info||{}));
  let cur=day||'all';
  const ov=document.createElement('div'); ov.className='modal-ov';
  const card=document.createElement('div'); card.className='modal-card jr-ae'; card.style.cssText='max-width:26rem;width:100%';
  const v=(x)=>esc(x||''), t5=t=>t?t.slice(0,5):'';
  card.innerHTML=`<h2>${ev?'Edit event':'＋ Add event'}</h2>
    <div class="jr-ae-tabs" id="ae-tabs" hidden></div>
    <div id="ae-all">
      <label class="field"><span>Title</span><input id="ae-title" autocomplete="off" value="${v(ev?.title)}"></label>
      <div class="jr-ae-row">
        <label class="field"><span>Date</span><input id="ae-date" type="date" value="${ev?.event_date||prefillDate||jrToday()}"></label>
        <label class="field"><span>To <span class="muted">(optional)</span></span><input id="ae-end-date" type="date" value="${ev&&jrMulti(ev)?ev.end_date:''}"></label>
      </div>
      <div class="jr-ae-row jr-ae-row3">
        <label class="field"><span>From <span class="muted">(time)</span></span><input id="ae-time" type="time" value="${t5(ev?.event_time)}"></label>
        <label class="field"><span>To</span><input id="ae-end-time" type="time" value="${t5(ev?.end_time)}"></label>
        <label class="field jr-ae-loc"><span>Location <span class="muted">(optional)</span><button type="button" class="jr-ae-map" data-for="#ae-loc">${JR_PIN}Map</button></span><input id="ae-loc" autocomplete="off" placeholder="A place, or a Google Maps link" value="${v(ev?.location)}"></label>
      </div>
      <label class="field"><span>Category <span class="muted">(optional)</span></span><input id="ae-cat" autocomplete="off" value="${v(ev?.category)}"></label>
      <label class="field"><span>Notes <span class="muted">(optional)</span></span><input id="ae-notes" autocomplete="off" value="${v(ev?.notes)}"></label>
    </div>
    <div id="ae-daybox" hidden>
      <p class="jr-ae-hint" id="ae-hint"></p>
      <div class="jr-ae-row">
        <label class="field"><span>From <span class="muted">(time)</span></span><input id="ad-time" type="time"></label>
        <label class="field"><span>To</span><input id="ad-end-time" type="time"></label>
      </div>
      <label class="field jr-ae-loc"><span>Location<button type="button" class="jr-ae-map" data-for="#ad-loc">${JR_PIN}Map</button></span><input id="ad-loc" autocomplete="off" placeholder="A place, or a Google Maps link"></label>
      <label class="field"><span>Notes</span><input id="ad-notes" autocomplete="off"></label>
      <button type="button" class="mini" id="ad-reset">Use the whole event’s details for this day</button>
    </div>
    <div class="item-edit-actions">
      ${ev?'<button class="mini jr-ae-del" id="ae-del">Delete</button>':''}
      <button class="mini" id="ae-cancel">Cancel</button>
      <button class="act" id="ae-save">${ev?'Save':'Add event'}</button>
    </div>`;
  ov.appendChild(card); document.body.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) dismiss(ov); };
  const q=s=>card.querySelector(s);
  const lbl=iso=>{ const d=new Date(iso+'T00:00:00'); return DAY_NAMES[d.getDay()].slice(0,3)+' '+d.getDate(); };
  const longLbl=iso=>{ const d=new Date(iso+'T00:00:00'); return `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`; };
  // the days of the event as the dates stand now (a span of one day or under has no day tabs)
  const spanList=()=>{ const a=q('#ae-date').value, b=q('#ae-end-date').value;
    if(!a||!b||b<=a||jrDays(a,b)>60) return []; return Array.from({length:jrDays(a,b)+1},(_,i)=>jrAddDays(a,i)); };
  // the open day tab's fields go into `days` (an empty day is no entry)
  function stash(){
    if(cur==='all') return;
    const one={}, t=q('#ad-time').value, t2=q('#ad-end-time').value, l=q('#ad-loc').value.trim(), n=q('#ad-notes').value.trim();
    if(t) one.event_time=t; if(t2) one.end_time=t2; if(l) one.location=l; if(n) one.notes=n;
    if(Object.keys(one).length) days[cur]=one; else delete days[cur];
  }
  function showPanel(){
    const dm=cur!=='all', list=spanList();
    q('#ae-all').hidden=dm; q('#ae-daybox').hidden=!dm;
    q('h2').textContent=dm?longLbl(cur):(ev?'Edit event':'＋ Add event');
    if(!dm) return;
    const o=days[cur]||{};
    q('#ad-time').value=t5(o.event_time); q('#ad-end-time').value=t5(o.end_time); q('#ad-loc').value=o.location||''; q('#ad-notes').value=o.notes||'';
    const base=[jrTimeRange({event_time:q('#ae-time').value||null,end_time:q('#ae-end-time').value||null}), q('#ae-loc').value.trim()].filter(Boolean).join(' · ');
    q('#ae-hint').innerHTML=`Day ${Math.max(1,list.indexOf(cur)+1)} of ${list.length}, only for this day. Leave a field empty to use the whole event’s${base?` (<b>${esc(base)}</b>)`:''}.`;
  }
  function drawTabs(){
    const list=spanList(), tabs=q('#ae-tabs');
    tabs.hidden=list.length<2;
    if(list.length<2 || (cur!=='all' && !list.includes(cur))){ if(cur!=='all'){ cur='all'; showPanel(); } }
    tabs.innerHTML=`<button type="button" class="jr-ae-tab${cur==='all'?' on':''}" data-d="all">Whole event</button>`
      +list.map(iso=>`<button type="button" class="jr-ae-tab${cur===iso?' on':''}${days[iso]?' has':''}" data-d="${iso}">${lbl(iso)}</button>`).join('');
  }
  q('#ae-tabs').onclick=e=>{ const b=e.target.closest('.jr-ae-tab'); if(!b) return; stash(); cur=b.dataset.d; showPanel(); drawTabs(); };
  q('#ad-reset').onclick=()=>{ delete days[cur]; showPanel(); drawTabs(); };
  // "Map" by a Location field: see the place as typed (to check it, or find the right one and paste its link back)
  card.querySelectorAll('.jr-ae-map').forEach(b=>b.onclick=e=>{ e.preventDefault();
    const loc=q(b.dataset.for).value.trim() || (b.dataset.for==='#ad-loc' ? q('#ae-loc').value.trim() : '');
    if(!loc){ toast('Type a place first'); return; } open(jrMapUrl(loc),'_blank','noopener'); });
  // the end date can't be before the start: its picker starts there, and a start moved past it takes it along
  const syncEnd=()=>{ const a=q('#ae-date').value, b=q('#ae-end-date'); b.min=a; if(b.value && a && b.value<a) b.value=''; };
  q('#ae-date').addEventListener('change', ()=>{ stash(); syncEnd(); drawTabs(); });
  q('#ae-end-date').addEventListener('change', ()=>{ stash(); drawTabs(); });
  syncEnd(); if(cur!=='all' && !spanList().includes(cur)) cur='all'; showPanel(); drawTabs();
  q('#ae-cancel').onclick=()=>dismiss(ov);
  if(ev) q('#ae-del').onclick=()=>{ dismiss(ov); deleteEventRow(ev.id); };   // asks to confirm first
  // Enter in any field saves, like pressing the button
  card.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.tagName==='INPUT'){ e.preventDefault(); q('#ae-save').click(); } });
  q('#ae-save').onclick=async()=>{
    stash();
    const title=q('#ae-title').value.trim(), event_date=q('#ae-date').value;
    let end_date=q('#ae-end-date').value||null;
    const event_time=q('#ae-time').value||null, end_time=q('#ae-end-time').value||null;
    if(!title){ toast('Title is required'); return; }
    if(!event_date){ toast('Date is required'); return; }
    if(end_date && end_date<event_date){ toast('The end date is before the start'); return; }
    if(end_date===event_date) end_date=null;
    if(end_time && !event_time){ toast('Give a start time too'); return; }
    if(end_time && !end_date && end_time<=event_time){ toast('The end time is before the start'); return; }
    // the days' own details: gone when it's one day; moved along when the whole span was moved
    let di=end_date?days:{};
    if(end_date && ev && jrMulti(ev) && event_date!==ev.event_date && jrDays(event_date,end_date)===jrDays(ev.event_date,ev.end_date))
      di=jrShiftDays(days, jrDays(ev.event_date,event_date));
    const body={event_date, end_date, event_time, end_time, title, day_info:Object.keys(di).length?di:null,
      location:q('#ae-loc').value.trim()||null, category:q('#ae-cat').value.trim()||null, notes:q('#ae-notes').value.trim()||null};
    try{
      const saved=await api('/api/journal/events'+(ev?'/'+ev.id:''),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

// Lays out the titles in the day squares. Runs after every render and whenever the grid changes size.
// A one-day event stays inside its own day: a long title wraps onto more lines (between words), and ends "…"
// when the square has no more room — it never runs into the next days, where it would look like it lasts
// longer. Only a multi-day event's bar crosses days, locked to the days it covers. Each week is filled in rows
// ("lanes"), left to right: a bar running into later days keeps its lane there, so those days' own titles go
// below it. Titles that don't fit a square's height become "+N".
function jrFitCells(){
  const grid=document.getElementById('jr-cal-grid'); if(!grid) return;
  const cells=[...grid.querySelectorAll('.jr-cal-day')];
  grid.querySelectorAll('.jr-ev-gap').forEach(g=>g.remove());
  const laneOf={};                                  // laneOf[event id] = the line its bar had in the row above
  for(let r=0; r<cells.length; r+=7){
    const busy=[];                                   // busy[lane] = first column where that lane is free again
    for(let c=0; c<7 && r+c<cells.length; c++){
      const cell=cells[r+c], pv=cell.querySelector('.jr-preview'); if(!pv) continue;
      const evs=[...pv.querySelectorAll('.jr-ev')], more=cell.querySelector('.jr-more');
      const pad=parseFloat(getComputedStyle(cell).paddingLeft)||0, colW=cell.offsetWidth;
      const room=colW-2*pad;                                          // its own day, never the next ones
      pv.classList.remove('tight');
      pv.style.setProperty('--room', room+'px');
      evs.forEach(e=>{ e.hidden=false; e.classList.remove('wrap'); });
      const gap=parseFloat(getComputedStyle(pv).rowGap)||0;
      const laneH=evs[0].offsetHeight || 16, lanes=Math.max(0, Math.floor((pv.clientHeight+gap)/(laneH+gap)));
      let lane=0, shown=0;
      const firstFree=(from, n)=>{ let at=from; while(at<from+64 && [...Array(n).keys()].some(k=>(busy[at+k]||0)>c)) at++; return at; };
      for(const e of evs){
        e.classList.remove('cut','clamp'); e.style.webkitLineClamp='';
        if(!e.dataset.span) jrFitWords(e, room);
        // a multi-day bar is locked to its days: exactly from this square to its last one in the row, one line
        const span=+e.dataset.span||0;
        if(span){ const last=cells[r+c+span-1]||cell; e.style.width=(last.offsetLeft+colW-pad-(cell.offsetLeft+pad))+'px'; }
        else if(e.scrollWidth>e.clientWidth+1) e.classList.add('wrap');     // longer than the room left: wrap at the edge
        let lines=span?1:Math.max(1, Math.round((e.offsetHeight+gap)/(laneH+gap)));
        // a bar carrying on from the row above goes on the same line it had there (if that line is near the top)
        const want=span && e.classList.contains('cont-l') ? laneOf[e.dataset.id] : undefined;
        let at=want!=null && want<=2 ? firstFree(Math.max(lane,want), 1) : firstFree(lane, lines);
        // no room for all its wrapped lines: as many lines as there are, the last ending "…"; or, with room for
        // only one, a single line — title first, the time dropped (the day panel has both in full)
        if(at+lines>lanes && lines>1){
          at=firstFree(lane, 1);
          const fit=Math.max(1, lanes-at);
          if(fit>1){ e.classList.replace('wrap','clamp'); e.style.webkitLineClamp=fit; lines=fit; at=firstFree(lane, fit); }
          else { e.classList.replace('wrap','cut'); lines=1; }
        }
        if(at+lines>lanes) break;
        for(let k=lane; k<at; k++){ const g=document.createElement('span'); g.className='jr-ev-gap'; g.style.height=laneH+'px'; e.before(g); }
        // the first day it no longer reaches into (2px of breathing room before the next title)
        const free=Math.floor((cell.offsetLeft+e.offsetLeft+e.offsetWidth+2)/colW)+1;
        for(let k=0; k<lines; k++) busy[at+k]=free;
        if(span) laneOf[e.dataset.id]=at;
        lane=at+lines; shown++;

      evs.forEach((e,i)=>e.hidden=i>=shown);
      more.hidden=shown>=evs.length; more.textContent=more.hidden?'':'+'+(evs.length-shown);
    }
  }
}

          <button class="ok${e.done?' on':''}" onclick="toggleEventDone(${e.id})" title="${e.done?'Mark not done':'Mark done'}" aria-label="${e.done?'Mark not done':'Mark done'}">✓</button>
          <button class="del" onclick="deleteEventRow(${e.id})" title="Delete" aria-label="Delete">✕</button>
        </span>
        ${sub?`<span class="jr-dc-sub" onclick="editEventWhen(${e.id},'#ae-loc')" title="Edit details">${sub}</span>`:''}
      </article>`;}).join('')}</div>`
    :`<div class="jr-day-empty">Nothing planned.<span>Double-tap a day or press + to add one.</span></div>`}`;
  if(enter && !K_REDUCED.matches){ box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter'); box.scrollTop=0;
    // a later day comes in from the right, an earlier one from the left
    const row=box.querySelector('.jr-day-list,.jr-day-empty');

// Events this device kept on its own before it had a shared backend (the GitHub site's local mode).
// Once a backend answers, offer them to it once. The device keeps its copy either way.
async function jrOfferLocalEvents(){
  if(!JR_API || JR_FROZEN) return;
  let local; try{ local=JSON.parse(localStorage.getItem('journal_local_events'))?.events||[]; }catch(_){ local=[]; }
  const doneKey='journal_local_offered:'+JR_API;
  if(!local.length || localStorage.getItem(doneKey)) return;
  const n=local.length;
  const yes=await askConfirm(`This device has ${n} event${n>1?'s':''} saved only on it. Copy ${n>1?'them':'it'} to the shared calendar so everyone can see ${n>1?'them':'it'}?`);
  try{ localStorage.setItem(doneKey, yes?'copied':'declined'); }catch(_){}
  if(!yes) return;
  try{
    const r=await api('/api/journal/import', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({events:local})});
    toast(`Copied ${r.imported} event${r.imported===1?'':'s'}`);
    JOURNAL_EVENTS=await jrFetchEvents(); jrRender();
  }catch(e){ toast('Could not copy: '+e.message); localStorage.removeItem(doneKey); }
}

// ---- liquid glass bead (Odin's Keep's tab bar) ----
// The chosen option sits in a glass bead. Press and slide (or press and hold) and the bead lifts off and
// follows the finger, stretching with speed, the option under it swelling; let go and that option is
// picked and the bead springs onto it. A plain tap is still a plain tap.
// It follows the way the options are laid out (a row or a column), read from the layout each time, so the
// same bar works as the phone's bottom bar and the side menu. A bar with no active option (the month bar) shows
// its bead only while held, and flashes it on a tap.
function jrBead(bar){
  if(!bar) return;
  const LIFT=230, SLOP=8;
  let axis='y';
  const readAxis=()=>{ axis=getComputedStyle(bar).flexDirection.startsWith('column')?'y':'x'; };
  const bead=document.createElement('span'); bead.className='jr-bead no-anim'; bead.setAttribute('aria-hidden','true');
  bar.prepend(bead); bar.classList.add('jr-beadbar');
  const items=()=>[...bar.querySelectorAll(':scope > button')].filter(b=>b.offsetWidth);
  const box=b=>({x:b.offsetLeft, y:b.offsetTop, w:b.offsetWidth, h:b.offsetHeight});
  const place=(x,y,w,h)=>{ bead.style.translate=`${x.toFixed(1)}px ${y.toFixed(1)}px`; bead.style.width=w.toFixed(1)+'px'; bead.style.height=h.toFixed(1)+'px'; };
  let start=null, held=null, timer=0, swallow=0, ready=false, flashT=0;
  function sync(){
    if(held) return;
    readAxis();
    const a=items().find(b=>b.classList.contains('active'));
    if(!a){ if(!flashT) bead.classList.remove('on'); return; }
    const q=box(a); place(q.x,q.y,q.w,q.h); bead.classList.add('on');
    if(!ready){ ready=true; requestAnimationFrame(()=>requestAnimationFrame(()=>bead.classList.remove('no-anim'))); }
  }
  const under=(x,y)=>items().find(b=>{ const r=b.getBoundingClientRect(); return axis==='x'?x>=r.left&&x<r.right:y>=r.top&&y<r.bottom; });
  function follow(x,y){
    const now=performance.now(), p=axis==='x'?x:y, dt=Math.max(1,now-held.t);
    held.v=held.v*.5+((p-held.last)/dt*1000)*.5; held.last=p; held.t=now; held.x=x; held.y=y;
    const u=under(x,y); items().forEach(b=>b.classList.toggle('bead-under', b===u));
    const q=box(u||held.from), br=bar.getBoundingClientRect(), k=1.12+Math.min(.45,Math.abs(held.v)/2400);   // lifts a bit bigger, stretches with speed
    if(axis==='x'){ const w=q.w*k; place(x-br.left-w/2, q.y-3, w, q.h+6); }
    else { const h=q.h*k; place(q.x-3, y-br.top-h/2, q.w+6, h); }
  }
  function lift(){
    if(!start || held) return;
    readAxis();
    held={from:start.b, v:0, last:axis==='x'?start.x:start.y, t:performance.now(), x:start.x, y:start.y};
    try{ bar.setPointerCapture(start.id); }catch(_){}
    if(!bead.classList.contains('on')){ const q=box(start.b); bead.classList.add('no-anim'); place(q.x,q.y,q.w,q.h); void bead.offsetWidth; bead.classList.remove('no-anim'); }
    bead.classList.add('drag','on'); bar.classList.add('liquid');
    if(navigator.vibrate) try{ navigator.vibrate(6); }catch(_){}
    follow(start.x,start.y);
  }
  function drop(cancel){
    clearTimeout(timer); start=null;
    if(!held) return;
    const u=cancel?null:under(held.x,held.y); held=null;
    bead.classList.remove('drag'); bar.classList.remove('liquid'); items().forEach(b=>b.classList.remove('bead-under'));
    if(u) u.click();                                   // the pick does what a tap on it would
    swallow=Date.now();                                // …and the release itself isn't another tap
    sync(); if(!items().some(b=>b.classList.contains('active'))) setTimeout(()=>{ if(!held) bead.classList.remove('on'); }, 260);
  }
  bar.addEventListener('pointerdown',e=>{
    const b=e.target.closest('button'); if(!b || e.button>0 || b.parentElement!==bar) return;
    start={x:e.clientX, y:e.clientY, b, id:e.pointerId}; clearTimeout(timer);
    timer=setTimeout(lift, LIFT);
  });
  bar.addEventListener('pointermove',e=>{
    if(held){ e.preventDefault(); follow(e.clientX,e.clientY); return; }
    if(start && Math.hypot(e.clientX-start.x, e.clientY-start.y)>SLOP){ clearTimeout(timer); lift(); }   // sliding: lift at once
  });
  bar.addEventListener('pointerup',()=>drop(false));
  bar.addEventListener('pointercancel',()=>drop(true));
  bar.addEventListener('click',e=>{
    if(Date.now()-swallow<350 && e.isTrusted){ e.stopPropagation(); e.preventDefault(); return; }
    // no option stays chosen here (the month bar): a tap flashes the bead on what was tapped
    const b=e.target.closest('button');
    if(b && !items().some(x=>x.classList.contains('active')) && !K_REDUCED.matches){
      const q=box(b); bead.classList.add('no-anim'); place(q.x,q.y,q.w,q.h); void bead.offsetWidth; bead.classList.remove('no-anim');
      bead.classList.add('on','flash'); clearTimeout(flashT);
      flashT=setTimeout(()=>{ flashT=0; bead.classList.remove('on','flash'); }, 380);
    }
  },true);
  new MutationObserver(ms=>{ if(ms.some(m=>m.target!==bead)) requestAnimationFrame(sync); })
    .observe(bar,{subtree:true,attributes:true,attributeFilter:['class']});
  if(window.ResizeObserver) new ResizeObserver(()=>sync()).observe(bar);
  if(document.fonts) document.fonts.ready.then(sync);
  sync();
}

// The month bar and Add event as one pill, ‹ Today › +:
//   phones held upright — at the bottom right, next to Calendar / Agenda (in the bar the side menu becomes);
//   desktop — under whichever view is open, so + is there in Agenda too (the arrows step aside there);
//   phones on their side and short windows — as they were: month bar under the month, + in the side menu.
// The two elements are moved into place whenever the screen changes; moving keeps their handlers and the bead.
(function jrPhoneBar(){
  const phone=matchMedia('(max-width:760px) and (orientation:portrait)'), desk=matchMedia('(min-width:761px) and (min-height:521px)');
  const rail=document.querySelector('.jr-rail'), main=document.querySelector('main'), nav=document.getElementById('jr-monthnav'), add=rail.querySelector('.jr-add');
  const navHome=nav.parentElement, navNext=nav.nextSibling;
  const place=()=>{
    if(phone.matches){ if(nav.parentElement!==rail) rail.appendChild(nav); if(add.parentElement!==nav) nav.appendChild(add); }
    else if(desk.matches){ if(nav.parentElement!==main) main.appendChild(nav); if(add.parentElement!==nav) nav.appendChild(add); }
    else { if(nav.parentElement!==navHome) navHome.insertBefore(nav, navNext); if(add.parentElement!==rail) rail.appendChild(add); }
  };
  place();
  for(const mq of [phone,desk]) mq.addEventListener ? mq.addEventListener('change', place) : mq.addListener(place);
})();

// ---- trackpad swipe: the phone's swipe, on desktop ----
// A two-finger sideways swipe over the month changes month, over the day panel steps a day. What's under the
// fingers follows them, the same pull as on a phone, then goes or springs back. Up/down scrolling is left alone.
(function(){
  let acc=0, el=null, day=false, idleT=0, quietUntil=0;
  const settle=(spring)=>{
    clearTimeout(idleT);
    if(el){
      const x=el;
      x.style.transition=spring&&!K_REDUCED.matches?'transform .3s var(--k-smooth), opacity .3s ease':'';
      x.style.transform=''; x.style.opacity='';
      if(spring) setTimeout(()=>{ x.style.transition=''; },320);
    }
    el=null; acc=0;
  };
  addEventListener('wheel',e=>{
    if(JR_VIEW!=='calendar' || e.ctrlKey || document.querySelector('.modal-ov')) return;   // ctrl+wheel is pinch-zoom
    if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)) return;
    const top=e.target.closest?.('.jr-top'), bot=!top && e.target.closest?.('.jr-bottom'); if(!top && !bot) return;
    e.preventDefault();                                   // no browser back/forward swipe
    if(Date.now()<quietUntil) return;                     // the momentum tail of a swipe that already went
    if(!el){ day=!!bot; el=top?$('#jr-cal-grid'):bot.querySelector('.jr-day-list,.jr-day-empty'); }
    acc-=e.deltaX*(e.deltaMode===1?16:1);                 // the content moves with the fingers
    if(el && !K_REDUCED.matches){ el.style.transition='none'; el.style.transform=`translateX(${(acc*.45).toFixed(1)}px)`;
      el.style.opacity=String(Math.max(.35,1-Math.abs(acc)/400)); }
    if(Math.abs(acc)>120){
      const dir=acc<0?1:-1; settle(false); quietUntil=Date.now()+550;
      if(day) calShiftDay(dir); else calShiftMonth(dir);
      return;
    }
    clearTimeout(idleT); idleT=setTimeout(()=>settle(true), 160);   // fingers lifted short of it: spring back
  },{passive:false});
})();

// ---- touch shine (Odin's Keep's tile sheen, for fingers too) ----
// A soft highlight sits where the finger (or mouse) is on a glass surface, as if light caught it there.
(function(){
  let cur=null, offT=0;
  const at=(el,e)=>{ const r=el.getBoundingClientRect(); el.style.setProperty('--mx',(e.clientX-r.left).toFixed(0)+'px'); el.style.setProperty('--my',(e.clientY-r.top).toFixed(0)+'px'); };
  const on=(el,e)=>{ at(el,e); el.classList.add('shining'); };
  addEventListener('pointerdown',e=>{ if(K_REDUCED.matches) return; const el=e.target.closest?.('.k-shine'); if(!el) return;
    clearTimeout(offT); if(cur&&cur!==el) cur.classList.remove('shining'); cur=el; on(el,e); },{passive:true,capture:true});
  addEventListener('pointermove',e=>{ if(K_REDUCED.matches) return;
    if(e.pointerType==='mouse'){ const el=e.target.closest?.('.k-shine'); if(cur&&cur!==el) cur.classList.remove('shining'); cur=el; if(el) on(el,e); }
    else if(cur) at(cur,e); },{passive:true});
  const off=e=>{ if(e.pointerType==='mouse'||!cur) return; const el=cur; cur=null; offT=setTimeout(()=>el.classList.remove('shining'),220); };
  addEventListener('pointerup',off,{passive:true}); addEventListener('pointercancel',off,{passive:true});
})();

// ---- drag an event to another day ----
// Mouse: press on a title in a day square and drag. Touch: press and hold it (so swipes and taps still work),
// then drag. The title follows the pointer, the day under it lights up, and letting go moves the event there.
(function(){
  const HOLD=320, SLOP=6;
  let pend=null, drag=null, holdT=0;
  const grid=()=>document.getElementById('jr-cal-grid');
  // by position, not by what's on top: a long title running across a day belongs to the day it started on
  const dayAt=(x,y)=>[...document.querySelectorAll('#jr-cal-grid .jr-cal-day')].find(d=>{ const r=d.getBoundingClientRect(); return x>=r.left&&x<r.right&&y>=r.top&&y<r.bottom; });
  const isoOf=cell=>(cell?.getAttribute('onclick')||'').match(/'(\d{4}-\d{2}-\d{2})'/)?.[1]||null;
  function begin(){
    const {chip,x,y,id}=pend; pend=null;
    if(JR_FROZEN){ toast('Server offline — changes are paused'); return; }
    const ev=JOURNAL_EVENTS.find(e=>e.id===id); if(!ev) return;
    const r=chip.getBoundingClientRect();
    const ghost=chip.cloneNode(true); ghost.className=chip.className+' jr-ev-ghost'; ghost.removeAttribute('data-id');
    const cs=getComputedStyle(chip);                               // out of its square it would lose the phone sizes
    Object.assign(ghost.style,{left:r.left+'px', top:r.top+'px', width:r.width+'px', maxWidth:'none',
      fontSize:cs.fontSize, lineHeight:cs.lineHeight, padding:cs.padding, letterSpacing:cs.letterSpacing});
    document.body.appendChild(ghost);
    chip.classList.add('dragging'); document.body.classList.add('jr-dragging');
    // a multi-day bar moves by however many days it's dragged, from the day it was picked up on
    drag={ev, chip, ghost, gx:x-r.left, gy:y-r.top, from:chip.dataset.span?(isoOf(dayAt(x,y))||ev.event_date):ev.event_date, over:null};
    JR_EVDRAG=drag;
    if(navigator.vibrate) try{ navigator.vibrate(10); }catch(_){}
    move(x,y);
  }
  function move(x,y){
    drag.ghost.style.translate=`${(x-drag.gx-parseFloat(drag.ghost.style.left)).toFixed(1)}px ${(y-drag.gy-parseFloat(drag.ghost.style.top)).toFixed(1)}px`;
    const cell=dayAt(x,y);
    if(cell!==drag.over){ drag.over?.classList.remove('drop-target'); drag.over=cell; cell?.classList.add('drop-target'); }
  }
  async function end(cancel){
    const d=drag; drag=null; JR_EVDRAG=null; JR_GESTURE_AT=Date.now();
    document.body.classList.remove('jr-dragging'); d.over?.classList.remove('drop-target');
    const to=cancel?null:isoOf(d.over);
    if(!to || to===d.from){                                        // nowhere new: the title flies back home
      d.chip.classList.remove('dragging');
      const r=d.chip.getBoundingClientRect();
      if(d.ghost.animate && !K_REDUCED.matches){
        await d.ghost.animate([{translate:d.ghost.style.translate},{translate:`${r.left-parseFloat(d.ghost.style.left)}px ${r.top-parseFloat(d.ghost.style.top)}px`, opacity:.4}],
          {duration:260, easing:'cubic-bezier(.2,.9,.25,1)'}).finished.catch(()=>{});
      }
      d.ghost.remove(); return;
    }
    d.ghost.remove();
    const ev=d.ev, before=ev.event_date, beforeEnd=ev.end_date, beforeDays=ev.day_info, shift=jrDays(d.from, to);
    const patch={event_date:jrAddDays(ev.event_date, shift)};
    if(jrMulti(ev)){ patch.end_date=jrAddDays(ev.end_date, shift); if(ev.day_info) patch.day_info=jrShiftDays(ev.day_info, shift); }
    Object.assign(ev, patch);                                      // move it now; the backend confirms behind it
    calSelect(to);
    requestAnimationFrame(()=>document.querySelector(`#jr-cal-grid .jr-ev[data-id="${ev.id}"]`)?.classList.add('landed'));
    const d2=new Date(ev.event_date+'T00:00:00');
    try{
      const upd=await api('/api/journal/events/'+ev.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
      const i=JOURNAL_EVENTS.findIndex(x=>x.id===ev.id); if(i>=0) JOURNAL_EVENTS[i]=upd;
      toast(jrMulti(upd)?`Moved to ${jrDateRange(upd)}`:`Moved to ${DAY_NAMES[d2.getDay()].slice(0,3)} ${d2.getDate()} ${MONTH_NAMES[d2.getMonth()].slice(0,3)}`);
    }catch(e){
      ev.event_date=before; ev.end_date=beforeEnd; ev.day_info=beforeDays; jrRender();
      if(!(e instanceof JrOffline)) toast('Could not move: '+e.message);
    }
  }
  addEventListener('pointerdown',e=>{
    if(e.button>0 || JR_VIEW!=='calendar' || drag) return;
    const chip=e.target.closest?.('#jr-cal-grid .jr-ev[data-id]'); if(!chip || chip.hidden) return;
    pend={chip, id:+chip.dataset.id, x:e.clientX, y:e.clientY, touch:e.pointerType!=='mouse'};
    clearTimeout(holdT);
    if(pend.touch) holdT=setTimeout(()=>{ if(pend) begin(); }, HOLD);
  },true);
  addEventListener('pointermove',e=>{
    if(drag){ e.preventDefault(); move(e.clientX,e.clientY); return; }
    if(!pend) return;
    const far=Math.hypot(e.clientX-pend.x, e.clientY-pend.y)>SLOP;
    if(far && pend.touch){ clearTimeout(holdT); pend=null; return; }   // moved before the hold: it's a swipe
    if(far){ pend.x=e.clientX; pend.y=e.clientY; begin(); }           // mouse: dragging starts it
  },{passive:false});
  addEventListener('pointerup',()=>{ clearTimeout(holdT); pend=null; if(drag) end(false); });
  addEventListener('pointercancel',()=>{ clearTimeout(holdT); pend=null; if(drag) end(true); });
  // a touch drag must not scroll or pull-to-refresh the page underneath
  addEventListener('touchmove',e=>{ if(drag && e.cancelable) e.preventDefault(); },{passive:false});
  addEventListener('contextmenu',e=>{ if(drag || pend) e.preventDefault(); });
  addEventListener('keydown',e=>{ if(drag && e.key==='Escape') end(true); });
})();

// ---- reminders (web push; the backend sends them, src/reminders.ts) ----
// A week and a day before each event, at the start of the working day. Offered once, from a small prompt,
// on devices that can receive them: iPhone only from the home-screen app (iOS 16.4+), Android in Chrome.
// Not in device-only mode — there's no server to send them. Once on, every start re-registers this device
// with the backend in use, so switching backend carries reminders along.
const JR_ISO=/^\d{4}-\d{2}-\d{2}$/;
function jrOpenDay(iso){ if(!JR_ISO.test(iso||'')) return; if(JR_VIEW!=='calendar') setJournalView('calendar'); calSelect(iso); }
navigator.serviceWorker?.addEventListener('message', e=>{ if(e.data?.type==='yai:open-day') jrOpenDay(e.data.date); });
const jrB64=s=>{ const p='='.repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b,c=>c.charCodeAt(0)); };
const jrPushable=()=>'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext;
const jrIsIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
async function jrPushKey(){ try{ return (await api('/api/push/key')).key; }catch(_){ return null; } }   // null: this backend has none
async function jrSubscribe(test){
  const key=await jrPushKey(); if(!key) return false;
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(sub && sub.options?.applicationServerKey){                     // made for another backend's key: start over
    const had=btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    if(had!==key){ await sub.unsubscribe().catch(()=>{}); sub=null; }
  }
  // In the Android app, the phone's "Allow" reaches Chrome a moment after the prompt closes, and registering
  // before then is refused ("permission denied"): so try a few times, a little longer apart each time.
  for(let i=0; !sub; i++){
    try{ sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:jrB64(key)}); }
    catch(e){ if(i>=4 || Notification.permission==='denied') throw e; await new Promise(r=>setTimeout(r, 600*(i+1))); }
  }
  await api('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(), test:!!test})});
  return true;
}
// What went wrong turning reminders on, in words that say what to do about it (the raw browser errors say nothing)
function jrPushWhy(e){
  const m=String(e?.message||e||''), ios=jrIsIOS();
  const where=ios?'Settings → Notifications → Yai Calendar':'Settings → Apps → Yai Calendar → Notifications';
  if(e instanceof JrOffline || /Failed to fetch|NetworkError|cannot reach/i.test(m)) return 'No connection to the calendar. Check your internet and try again.';
  if(/sign in/i.test(m)) return 'Sign in first, then turn reminders on.';
  if(e?.name==='NotAllowedError' || /permission/i.test(m) || Notification.permission==='denied')
    return `Notifications are blocked for this app. Open your phone’s ${where}, turn them on, then try again.`;
  if(e?.name==='AbortError' || /push service|storage/i.test(m))
    return ios ? 'The phone’s push service didn’t answer. Try again in a minute.'
      : 'This phone couldn’t reach its push service. It needs Google Play services and internet (some Wi-Fi networks block it): try again on mobile data.';
  if(e?.name==='InvalidStateError') return 'Close the app completely, open it again, and try once more.';
  return `Could not turn on reminders (${e?.name||'error'}: ${m.slice(0,80)}).`;
}
async function jrTurnOnReminders(){
  jrReminderPrompt(false);
  try{
    const p=await Notification.requestPermission();
    if(p!=='granted'){ toast(`Reminders stay off. To allow them: ${jrIsIOS()?'Settings → Notifications → Yai Calendar':'Settings → Apps → Yai Calendar → Notifications'}.`, 6000); return; }
    toast('Turning on reminders…');
    toast(await jrSubscribe(true) ? 'Reminders on — a test one is on its way' : 'This server doesn’t send reminders', 4000);
  }catch(e){
    console.warn('reminders:', e);
    toast(jrPushWhy(e), 8000);
  }
}
function jrReminderPrompt(show, html){
  let b=document.getElementById('jr-remind');
  if(!show){ if(b){ b.classList.add('leaving'); setTimeout(()=>b.remove(),260); } return; }
  if(b) return;
  b=document.createElement('div'); b.id='jr-remind'; b.setAttribute('role','dialog'); b.setAttribute('aria-label','Reminders');
  b.innerHTML=html; document.body.appendChild(b);
  b.querySelector('[data-later]').onclick=()=>{ try{ localStorage.setItem('jr_remind_later', String(Date.now())); }catch(_){} jrReminderPrompt(false); };
  b.querySelector('[data-on]')?.addEventListener('click', jrTurnOnReminders);
}
async function jrOfferReminders(){
  if(JR_FROZEN) return;
  if(!JR_API && window.JOURNAL_STATIC) return;                       // device-only: nobody to send them
  try{ const t=+localStorage.getItem('jr_remind_later')||0; if(Date.now()-t<14*86400000) return; }catch(_){}
  if(!jrPushable()){
    // iPhone in Safari: it works once the app is on the home screen
    if(jrIsIOS() && !navigator.standalone && await jrPushKey())
      jrReminderPrompt(true, `<div class="jr-remind-txt"><b>Get reminders</b><span>On iPhone: tap Share, then “Add to Home Screen”, and open Yai Calendar from there.</span></div>
        <button class="mini" data-later>Later</button>`);
    return;
  }
  if(Notification.permission==='granted'){ jrSubscribe(false).catch(()=>{}); return; }   // already on: keep this backend in step
  if(Notification.permission==='denied' || !(await jrPushKey())) return;
  jrReminderPrompt(true, `<div class="jr-remind-txt"><b>Get reminders</b><span>A week and a day before each event, at 7:00 in working hours.</span></div>
    <button class="mini" data-later>Later</button><button class="act" data-on>Turn on</button>`);
}

(async function boot(){
  await jrResolveApi();          // which backend, before anything is fetched
  // opened from a reminder (or a link) on a particular day
  const qd=new URLSearchParams(location.search).get('day');
  if(JR_ISO.test(qd||'')){ JR_SEL=qd; const d=new Date(qd+'T00:00:00'); JR_CAL_YEAR=d.getFullYear(); JR_CAL_MONTH=d.getMonth(); JR_VIEW='calendar'; }
  await checkAuth();
  await loadJournal();
  setTimeout(()=>{ if(!document.getElementById('pin-ov')) jrOfferReminders(); }, 1500);
})();
// Everyone shares one calendar: every 10s, and whenever the app comes back to the front, fetch the events
// again and redraw only if someone changed something. Never mid-form, and never behind the PIN screen.
// While frozen this is also what notices the backend is back.
(function(){
  let busy=false;
  async function sync(){
    if(busy || JR_EVDRAG || document.hidden || document.querySelector('.modal-ov,#pin-ov')) return;
    busy=true;
    try{
      const fresh=await jrFetchEvents();
      if(JSON.stringify(fresh)!==JSON.stringify(JOURNAL_EVENTS)){ JOURNAL_EVENTS=fresh; jrRender(); }
    }catch(_){}
    busy=false;
  }
  setInterval(sync, 10000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) sync(); });
  addEventListener('focus', sync);
})();
</script>
<script>/* offline app shell (static/sw.js): registers only on a trusted certificate; a new version shows a tap-to-reload pill */
if("serviceWorker" in navigator&&window.isSecureContext&&!/[?&]nosw\b/.test(location.search)){
  addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").then(function(r){r.update().catch(function(){});}).catch(function(){});});
  /* an installed app is often brought back rather than opened anew (Android especially), and then the browser
     doesn't look for a new version for a day: look each time it comes back to the front */
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") navigator.serviceWorker.getRegistration().then(function(r){r&&r.update().catch(function(){});}); });
  /* a new version that lands in the first seconds after opening, before anything was touched, just loads: a home-screen app
   would otherwise open the previous copy every time after an update */
  ["pointerdown","keydown"].forEach(function(t){addEventListener(t,function(){window.__kTouched=1;},{once:true,capture:true});});
  navigator.serviceWorker.addEventListener("message",function(e){ if(!e.data||e.data.type!=="odin:updated"||document.getElementById("k-upd"))return;
    if(performance.now()<6000&&!window.__kTouched){location.reload();return;}
    var b=document.createElement("button");b.id="k-upd";b.type="button";b.textContent="New version — tap to reload";
    b.style.cssText="position:fixed;left:50%;top:calc(.7rem + env(safe-area-inset-top));transform:translateX(-50%);z-index:99;border:0;border-radius:999px;padding:.55rem 1rem;font:600 .85rem system-ui,sans-serif;background:#82aaff;color:#16182a;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer";
    b.onclick=function(){location.reload();};document.body.appendChild(b);});
}</script>
