// ---- liquid glass bead (Odin's Keep's tab bar) ----
// The chosen option sits in a glass bead. Press and slide (or press and hold) and the bead lifts off and
// follows the finger, stretching with speed, the option under it swelling; let go and that option is
// picked and the bead springs onto it. A plain tap is still a plain tap.
// It follows the way the options are laid out (a row or a column), read from the layout each time, so the
// same bar works as the phone's bottom bar and the side menu. A bar with no active option (the month bar) shows
// its bead only while held, and flashes it on a tap.
function jrBead(bar){
  if(!bar) return;
  const LIFT=230, SLOP=8;
  let axis='y';
  const readAxis=()=>{ axis=getComputedStyle(bar).flexDirection.startsWith('column')?'y':'x'; };
  const bead=document.createElement('span'); bead.className='jr-bead no-anim'; bead.setAttribute('aria-hidden','true');
  bar.prepend(bead); bar.classList.add('jr-beadbar');
  const items=()=>[...bar.querySelectorAll(':scope > button')].filter(b=>b.offsetWidth);
  const box=b=>({x:b.offsetLeft, y:b.offsetTop, w:b.offsetWidth, h:b.offsetHeight});
  const place=(x,y,w,h)=>{ bead.style.translate=`${x.toFixed(1)}px ${y.toFixed(1)}px`; bead.style.width=w.toFixed(1)+'px'; bead.style.height=h.toFixed(1)+'px'; };
  let start=null, held=null, timer=0, swallow=0, ready=false, flashT=0;
  function sync(){
    if(held) return;
    readAxis();
    const a=items().find(b=>b.classList.contains('active'));
    if(!a){ if(!flashT) bead.classList.remove('on'); return; }
    const q=box(a); place(q.x,q.y,q.w,q.h); bead.classList.add('on');
    if(!ready){ ready=true; requestAnimationFrame(()=>requestAnimationFrame(()=>bead.classList.remove('no-anim'))); }
  }
  const under=(x,y)=>items().find(b=>{ const r=b.getBoundingClientRect(); return axis==='x'?x>=r.left&&x<r.right:y>=r.top&&y<r.bottom; });
  function follow(x,y){
    const now=performance.now(), p=axis==='x'?x:y, dt=Math.max(1,now-held.t);
    held.v=held.v*.5+((p-held.last)/dt*1000)*.5; held.last=p; held.t=now; held.x=x; held.y=y;
    const u=under(x,y); items().forEach(b=>b.classList.toggle('bead-under', b===u));
    const q=box(u||held.from), br=bar.getBoundingClientRect(), k=1.12+Math.min(.45,Math.abs(held.v)/2400);   // lifts a bit bigger, stretches with speed
    if(axis==='x'){ const w=q.w*k; place(x-br.left-w/2, q.y-3, w, q.h+6); }
    else { const h=q.h*k; place(q.x-3, y-br.top-h/2, q.w+6, h); }
  }
  function lift(){
    if(!start || held) return;
    readAxis();
    held={from:start.b, v:0, last:axis==='x'?start.x:start.y, t:performance.now(), x:start.x, y:start.y};
    try{ bar.setPointerCapture(start.id); }catch(_){}
    if(!bead.classList.contains('on')){ const q=box(start.b); bead.classList.add('no-anim'); place(q.x,q.y,q.w,q.h); void bead.offsetWidth; bead.classList.remove('no-anim'); }
    bead.classList.add('drag','on'); bar.classList.add('liquid');
    if(navigator.vibrate) try{ navigator.vibrate(6); }catch(_){}
    follow(start.x,start.y);
  }
  function drop(cancel){
    clearTimeout(timer); start=null;
    if(!held) return;
    const u=cancel?null:under(held.x,held.y); held=null;
    bead.classList.remove('drag'); bar.classList.remove('liquid'); items().forEach(b=>b.classList.remove('bead-under'));
    if(u) u.click();                                   // the pick does what a tap on it would
    swallow=Date.now();                                // …and the release itself isn't another tap
    sync(); if(!items().some(b=>b.classList.contains('active'))) setTimeout(()=>{ if(!held) bead.classList.remove('on'); }, 260);
  }
  bar.addEventListener('pointerdown',e=>{
    const b=e.target.closest('button'); if(!b || e.button>0 || b.parentElement!==bar) return;
    start={x:e.clientX, y:e.clientY, b, id:e.pointerId}; clearTimeout(timer);
    timer=setTimeout(lift, LIFT);
  });
  bar.addEventListener('pointermove',e=>{
    if(held){ e.preventDefault(); follow(e.clientX,e.clientY); return; }
    if(start && Math.hypot(e.clientX-start.x, e.clientY-start.y)>SLOP){ clearTimeout(timer); lift(); }   // sliding: lift at once
  });
  bar.addEventListener('pointerup',()=>drop(false));
  bar.addEventListener('pointercancel',()=>drop(true));
  bar.addEventListener('click',e=>{
    if(Date.now()-swallow<350 && e.isTrusted){ e.stopPropagation(); e.preventDefault(); return; }
    // no option stays chosen here (the month bar): a tap flashes the bead on what was tapped
    const b=e.target.closest('button');
    if(b && !items().some(x=>x.classList.contains('active')) && !K_REDUCED.matches){
      const q=box(b); bead.classList.add('no-anim'); place(q.x,q.y,q.w,q.h); void bead.offsetWidth; bead.classList.remove('no-anim');
      bead.classList.add('on','flash'); clearTimeout(flashT);
      flashT=setTimeout(()=>{ flashT=0; bead.classList.remove('on','flash'); }, 380);
    }
  },true);
  new MutationObserver(ms=>{ if(ms.some(m=>m.target!==bead)) requestAnimationFrame(sync); })
    .observe(bar,{subtree:true,attributes:true,attributeFilter:['class']});
  if(window.ResizeObserver) new ResizeObserver(()=>sync()).observe(bar);
  if(document.fonts) document.fonts.ready.then(sync);
  sync();
}

// The month bar and Add event as one pill, ‹ Today › +:
//   phones held upright — at the bottom right, next to Calendar / Agenda (in the bar the side menu becomes);
//   desktop — under whichever view is open, so + is there in Agenda too (the arrows step aside there);
//   phones on their side and short windows — as they were: month bar under the month, + in the side menu.
// The two elements are moved into place whenever the screen changes; moving keeps their handlers and the bead.
(function jrPhoneBar(){
  const phone=matchMedia('(max-width:760px) and (orientation:portrait)'), desk=matchMedia('(min-width:761px) and (min-height:521px)');
  const rail=document.querySelector('.jr-rail'), main=document.querySelector('main'), nav=document.getElementById('jr-monthnav'), add=rail.querySelector('.jr-add'), scan=rail.querySelector('.jr-scan');
  const navHome=nav.parentElement, navNext=nav.nextSibling;
  const place=()=>{
    if(phone.matches){ if(nav.parentElement!==rail) rail.appendChild(nav); if(add.parentElement!==nav) nav.appendChild(add); }
    else if(desk.matches){ if(nav.parentElement!==main) main.appendChild(nav); if(add.parentElement!==nav) nav.appendChild(add); }
    else { if(nav.parentElement!==navHome) navHome.insertBefore(nav, navNext); if(add.parentElement!==rail) rail.appendChild(add); }
    add.parentElement.insertBefore(scan, add);   // the photo button always sits just before +
  };
  place();
  for(const mq of [phone,desk]) mq.addEventListener ? mq.addEventListener('change', place) : mq.addListener(place);
})();

// ---- trackpad swipe: the phone's swipe, on desktop ----
// A two-finger sideways swipe over the month changes month, over the day panel steps a day. What's under the
// fingers follows them, the same pull as on a phone, then goes or springs back. Up/down scrolling is left alone.
(function(){
  let acc=0, el=null, day=false, idleT=0, quietUntil=0;
  const settle=(spring)=>{
    clearTimeout(idleT);
    if(el){
      const x=el;
      x.style.transition=spring&&!K_REDUCED.matches?'transform .3s var(--k-smooth), opacity .3s ease':'';
      x.style.transform=''; x.style.opacity='';
      if(spring) setTimeout(()=>{ x.style.transition=''; },320);
    }
    el=null; acc=0;
  };
  addEventListener('wheel',e=>{
    if(JR_VIEW!=='calendar' || e.ctrlKey || document.querySelector('.modal-ov')) return;   // ctrl+wheel is pinch-zoom
    if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)) return;
    const top=e.target.closest?.('.jr-top'), bot=!top && e.target.closest?.('.jr-bottom'); if(!top && !bot) return;
    e.preventDefault();                                   // no browser back/forward swipe
    if(Date.now()<quietUntil) return;                     // the momentum tail of a swipe that already went
    if(!el){ day=!!bot; el=top?$('#jr-cal-grid'):bot.querySelector('.jr-day-list,.jr-day-empty'); }
    acc-=e.deltaX*(e.deltaMode===1?16:1);                 // the content moves with the fingers
    if(el && !K_REDUCED.matches){ el.style.transition='none'; el.style.transform=`translateX(${(acc*.45).toFixed(1)}px)`;
      el.style.opacity=String(Math.max(.35,1-Math.abs(acc)/400)); }
    if(Math.abs(acc)>120){
      const dir=acc<0?1:-1; settle(false); quietUntil=Date.now()+550;
      if(day) calShiftDay(dir); else calShiftMonth(dir);
      return;
    }
    clearTimeout(idleT); idleT=setTimeout(()=>settle(true), 160);   // fingers lifted short of it: spring back
  },{passive:false});
})();

// ---- mouse wheel and trackpad up/down: step through the calendar ----
// Over the month, scrolling down goes to the next month and up to the previous; over the day panel it steps a day
// (unless that panel has more events than fit, then the wheel scrolls them as usual). One wheel notch is one step; a
// trackpad's small movements add up to one, and the tail of its momentum is let go by so a flick is one step, not five.
// Like the sideways swipe, what's under the fingers follows them (up and down here) and springs back if it doesn't go;
// when it does go, the new month or day slides in from the direction you scrolled.
(function(){
  let acc=0, resetT=0, quietUntil=0, el=null;
  const settle=spring=>{
    clearTimeout(resetT);
    if(el){ const x=el; x.style.transition=spring&&!K_REDUCED.matches?'transform .3s var(--k-smooth), opacity .3s ease':''; x.style.transform=''; x.style.opacity='';
      if(spring) setTimeout(()=>{ x.style.transition=''; },320); }
    el=null; acc=0;
  };
  addEventListener('wheel',e=>{
    if(JR_VIEW!=='calendar' || e.ctrlKey || e.metaKey || document.querySelector('.modal-ov,#pin-ov,#pw-ov')) return;
    if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return;                       // sideways swipes are the handler above's
    const top=e.target.closest?.('.jr-top'), bot=!top && e.target.closest?.('.jr-bottom'); if(!top && !bot) return;
    if(bot){ const l=bot.querySelector('.jr-day-list'); if(l && l.scrollHeight>l.clientHeight+1) return; }   // let a long list scroll
    e.preventDefault();
    const dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?400:1), now=Date.now();
    if(now<quietUntil) return;
    acc+=dy;
    const find=()=>top?$('#jr-cal-grid'):bot.querySelector('.jr-day-list,.jr-day-empty');
    if(Math.abs(acc)<70){
      // not far enough yet: the content leans with the scroll, then settles
      if(!K_REDUCED.matches){ el=el||find(); if(el){ el.style.transition='none'; el.style.transform=`translateY(${(-acc*.5).toFixed(1)}px)`; el.style.opacity=String(Math.max(.5,1-Math.abs(acc)/200)); } }
      clearTimeout(resetT); resetT=setTimeout(()=>settle(true),180);
      return;
    }
    const dir=acc>0?1:-1, notch=Math.abs(dy)>=50;     // a mouse wheel gives big jumps, a trackpad many small ones
    settle(false); quietUntil=now+(notch?240:520);
    if(top) calShiftMonth(dir); else calShiftDay(dir);
    if(!K_REDUCED.matches){                           // the new one comes in from below when going on, from above when going back
      const n=find(); n?.animate?.([{transform:`translateY(${dir*44}px)`,opacity:.2},{transform:'none',opacity:1}],{duration:420,easing:'cubic-bezier(.16,1,.3,1)'});
    }
  },{passive:false});
})();

// ---- touch shine (Odin's Keep's tile sheen, for fingers too) ----
// A soft highlight sits where the finger (or mouse) is on a glass surface, as if light caught it there.
(function(){
  let cur=null, offT=0;
  const at=(el,e)=>{ const r=el.getBoundingClientRect(); el.style.setProperty('--mx',(e.clientX-r.left).toFixed(0)+'px'); el.style.setProperty('--my',(e.clientY-r.top).toFixed(0)+'px'); };
  const on=(el,e)=>{ at(el,e); el.classList.add('shining'); };
  addEventListener('pointerdown',e=>{ if(K_REDUCED.matches) return; const el=e.target.closest?.('.k-shine'); if(!el) return;
    clearTimeout(offT); if(cur&&cur!==el) cur.classList.remove('shining'); cur=el; on(el,e); },{passive:true,capture:true});
  addEventListener('pointermove',e=>{ if(K_REDUCED.matches) return;
    if(e.pointerType==='mouse'){ const el=e.target.closest?.('.k-shine'); if(cur&&cur!==el) cur.classList.remove('shining'); cur=el; if(el) on(el,e); }
    else if(cur) at(cur,e); },{passive:true});
  const off=e=>{ if(e.pointerType==='mouse'||!cur) return; const el=cur; cur=null; offT=setTimeout(()=>el.classList.remove('shining'),220); };
  addEventListener('pointerup',off,{passive:true}); addEventListener('pointercancel',off,{passive:true});
})();

// ---- drag an event to another day ----
// Mouse: press on a title in a day square and drag. Touch: press and hold it (so swipes and taps still work),
// then drag. The title follows the pointer, the day under it lights up, and letting go moves the event there.
(function(){
  const HOLD=300, SLOP=8;   // a finger always wobbles a little: 8px before it counts as moving off
  let pend=null, drag=null, holdT=0;
  const grid=()=>document.getElementById('jr-cal-grid');
  // by position, not by what's on top: a long title running across a day belongs to the day it started on
  const dayAt=(x,y)=>[...document.querySelectorAll('#jr-cal-grid .jr-cal-day')].find(d=>{ const r=d.getBoundingClientRect(); return x>=r.left&&x<r.right&&y>=r.top&&y<r.bottom; });
  const isoOf=cell=>(cell?.getAttribute('onclick')||'').match(/'(\d{4}-\d{2}-\d{2})'/)?.[1]||null;
  function begin(){
    const {chip,x,y,id}=pend; pend=null;
    if(JR_FROZEN){ toast(tx('offlinePaused')); return; }
    const ev=JOURNAL_EVENTS.find(e=>e.id===id); if(!ev) return;
    const r=chip.getBoundingClientRect();
    const ghost=chip.cloneNode(true); ghost.className=chip.className+' jr-ev-ghost'; ghost.removeAttribute('data-id');
    const cs=getComputedStyle(chip);                               // out of its square it would lose the phone sizes
    Object.assign(ghost.style,{left:r.left+'px', top:r.top+'px', width:r.width+'px', maxWidth:'none',
      fontSize:cs.fontSize, lineHeight:cs.lineHeight, padding:cs.padding, letterSpacing:cs.letterSpacing});
    document.body.appendChild(ghost);
    chip.classList.add('dragging'); document.body.classList.add('jr-dragging');
    // a multi-day bar moves by however many days it's dragged, from the day it was picked up on
    drag={ev, chip, ghost, gx:x-r.left, gy:y-r.top, from:chip.dataset.span?(isoOf(dayAt(x,y))||ev.event_date):ev.event_date, over:null};
    JR_EVDRAG=drag;
    if(navigator.vibrate) try{ navigator.vibrate(10); }catch(_){}
    move(x,y);
  }
  function move(x,y){
    drag.ghost.style.translate=`${(x-drag.gx-parseFloat(drag.ghost.style.left)).toFixed(1)}px ${(y-drag.gy-parseFloat(drag.ghost.style.top)).toFixed(1)}px`;
    const cell=dayAt(x,y);
    if(cell!==drag.over){ drag.over?.classList.remove('drop-target'); drag.over=cell; cell?.classList.add('drop-target'); }
  }
  async function end(cancel){
    const d=drag; drag=null; JR_EVDRAG=null; JR_GESTURE_AT=Date.now();
    document.body.classList.remove('jr-dragging'); d.over?.classList.remove('drop-target');
    const to=cancel?null:isoOf(d.over);
    if(!to || to===d.from){                                        // nowhere new: the title flies back home
      d.chip.classList.remove('dragging');
      const r=d.chip.getBoundingClientRect();
      if(d.ghost.animate && !K_REDUCED.matches){
        await d.ghost.animate([{translate:d.ghost.style.translate},{translate:`${r.left-parseFloat(d.ghost.style.left)}px ${r.top-parseFloat(d.ghost.style.top)}px`, opacity:.4}],
          {duration:260, easing:'cubic-bezier(.2,.9,.25,1)'}).finished.catch(()=>{});
      }
      d.ghost.remove(); return;
    }
    d.ghost.remove();
    const ev=d.ev, before=ev.event_date, beforeEnd=ev.end_date, beforeDays=ev.day_info, shift=jrDays(d.from, to);
    const patch={event_date:jrAddDays(ev.event_date, shift)};
    if(jrMulti(ev)){ patch.end_date=jrAddDays(ev.end_date, shift); if(ev.day_info) patch.day_info=jrShiftDays(ev.day_info, shift); }
    Object.assign(ev, patch);                                      // move it now; the backend confirms behind it
    calSelect(to);
    requestAnimationFrame(()=>document.querySelector(`#jr-cal-grid .jr-ev[data-id="${ev.id}"]`)?.classList.add('landed'));
    const d2=new Date(ev.event_date+'T00:00:00');
    try{
      const upd=await api('/api/journal/events/'+ev.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
      const i=JOURNAL_EVENTS.findIndex(x=>x.id===ev.id); if(i>=0) JOURNAL_EVENTS[i]=upd;
      toast(tx('movedTo',{to:jrMulti(upd)?jrDateRange(upd):jrFmtShort(d2)}));
    }catch(e){
      ev.event_date=before; ev.end_date=beforeEnd; ev.day_info=beforeDays; jrRender();
      if(!(e instanceof JrOffline)) toast(tx('moveErr')+jrErr(e.message));
    }
  }
  addEventListener('pointerdown',e=>{
    if(e.button>0 || JR_VIEW!=='calendar' || drag) return;
    const chip=e.target.closest?.('#jr-cal-grid .jr-ev[data-id]'); if(!chip || chip.hidden) return;
    pend={chip, id:+chip.dataset.id, x:e.clientX, y:e.clientY, touch:e.pointerType!=='mouse'};
    clearTimeout(holdT);
    if(pend.touch) holdT=setTimeout(()=>{ if(pend) begin(); }, HOLD);
  },true);
  addEventListener('pointermove',e=>{
    if(drag){ e.preventDefault(); move(e.clientX,e.clientY); return; }
    if(!pend) return;
    const far=Math.hypot(e.clientX-pend.x, e.clientY-pend.y)>SLOP;
    if(far && pend.touch){ clearTimeout(holdT); pend=null; return; }   // moved before the hold: it's a swipe
    if(far){ pend.x=e.clientX; pend.y=e.clientY; begin(); }           // mouse: dragging starts it
  },{passive:false});
  addEventListener('pointerup',()=>{ clearTimeout(holdT); pend=null; if(drag) end(false); });
  addEventListener('pointercancel',()=>{ clearTimeout(holdT); pend=null; if(drag) end(true); });
  // a touch drag must not scroll or pull-to-refresh the page underneath
  addEventListener('touchmove',e=>{ if(drag && e.cancelable) e.preventDefault(); },{passive:false});
  addEventListener('contextmenu',e=>{ if(drag || pend) e.preventDefault(); });
  addEventListener('keydown',e=>{ if(drag && e.key==='Escape') end(true); });
})();

// ---- reminders (web push; the backend sends them, src/reminders.ts) ----
// A week and a day before each event, at the start of the working day. Offered once, from a small prompt,
// on devices that can receive them: iPhone only from the home-screen app (iOS 16.4+), Android in Chrome.
// Not in device-only mode — there's no server to send them. Once on, every start re-registers this device
// with the backend in use, so switching backend carries reminders along.
const JR_ISO=/^\d{4}-\d{2}-\d{2}$/;
function jrOpenDay(iso){ if(!JR_ISO.test(iso||'')) return; if(JR_VIEW!=='calendar') setJournalView('calendar'); calSelect(iso); }
navigator.serviceWorker?.addEventListener('message', e=>{ if(e.data?.type==='yai:open-day') jrOpenDay(e.data.date); });
const jrB64=s=>{ const p='='.repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b,c=>c.charCodeAt(0)); };
const jrPushable=()=>'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext;
const jrIsIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
async function jrPushKey(){ try{ return (await api('/api/push/key')).key; }catch(_){ return null; } }   // null: this backend has none
async function jrSubscribe(test){
  const key=await jrPushKey(); if(!key) return false;
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(sub && sub.options?.applicationServerKey){                     // made for another backend's key: start over
    const had=btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    if(had!==key){ await sub.unsubscribe().catch(()=>{}); sub=null; }
  }
  // In the Android app, the phone's "Allow" reaches Chrome a moment after the prompt closes, and registering
  // before then is refused ("permission denied"): so try a few times, a little longer apart each time.
  for(let i=0; !sub; i++){
    try{ sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:jrB64(key)}); }
    catch(e){ if(i>=4 || Notification.permission==='denied') throw e; await new Promise(r=>setTimeout(r, 600*(i+1))); }
  }
  await api('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(), test:!!test, lang:JR_LANG})});
  return true;
}
// What went wrong turning reminders on, in words that say what to do about it (the raw browser errors say nothing)
function jrPushWhy(e){
  const m=String(e?.message||e||''), ios=jrIsIOS(), where=tx(ios?'whereIos':'whereAndroid');
  if(e instanceof JrOffline || /Failed to fetch|NetworkError|cannot reach/i.test(m)) return tx('whyOffline');
  if(/sign in/i.test(m)) return tx('whySignIn');
  if(e?.name==='NotAllowedError' || /permission/i.test(m) || Notification.permission==='denied') return tx('whyBlocked',{where});
  if(e?.name==='AbortError' || /push service|storage/i.test(m)) return tx(ios?'whyPushIos':'whyPushAndroid');
  if(e?.name==='InvalidStateError') return tx('whyState');
  return tx('whyOther',{what:`${e?.name||'error'}: ${m.slice(0,80)}`});
}
async function jrTurnOnReminders(){
  jrReminderPrompt(false);
  try{
    const p=await Notification.requestPermission();
    if(p!=='granted'){ toast(tx('remStayOff',{where:tx(jrIsIOS()?'whereIos':'whereAndroid')}), 6000); return; }
    toast(tx('remTurning'));
    toast(await jrSubscribe(true) ? tx('remOn') : tx('remNoServer'), 4000);
  }catch(e){
    console.warn('reminders:', e);
    toast(jrPushWhy(e), 8000);
  }
}
function jrReminderPrompt(show, html){
  let b=document.getElementById('jr-remind');
  if(!show){ if(b){ b.classList.add('leaving'); setTimeout(()=>b.remove(),260); } return; }
  if(b) return;
  b=document.createElement('div'); b.id='jr-remind'; b.setAttribute('role','dialog'); b.setAttribute('aria-label',tx('remAria'));
  b.innerHTML=html; document.body.appendChild(b);
  b.querySelector('[data-later]').onclick=()=>{ try{ localStorage.setItem('jr_remind_later', String(Date.now())); }catch(_){} jrReminderPrompt(false); };
  b.querySelector('[data-on]')?.addEventListener('click', jrTurnOnReminders);
}
async function jrOfferReminders(){
  if(JR_FROZEN) return;
  if(!JR_API && window.JOURNAL_STATIC) return;                       // device-only: nobody to send them
  try{ const t=+localStorage.getItem('jr_remind_later')||0; if(Date.now()-t<14*86400000) return; }catch(_){}
  if(!jrPushable()){
    // iPhone in Safari: it works once the app is on the home screen
    if(jrIsIOS() && !navigator.standalone && await jrPushKey())
      jrReminderPrompt(true, `<div class="jr-remind-txt"><b>${esc(tx('remTitle'))}</b><span>${esc(tx('remIphone'))}</span></div>
        <button class="mini" data-later>${esc(tx('later'))}</button>`);
    return;
  }
  if(Notification.permission==='granted'){ jrSubscribe(false).catch(()=>{}); return; }   // already on: keep this backend in step
  if(Notification.permission==='denied' || !(await jrPushKey())) return;
  jrReminderPrompt(true, `<div class="jr-remind-txt"><b>${esc(tx('remTitle'))}</b><span>${esc(tx('remText'))}</span></div>
    <button class="mini" data-later>${esc(tx('later'))}</button><button class="act" data-on>${esc(tx('turnOn'))}</button>`);
}

(async function boot(){
  await jrResolveApi();          // which backend, before anything is fetched
  // opened from a reminder (or a link) on a particular day
  const qd=new URLSearchParams(location.search).get('day');
  if(JR_ISO.test(qd||'')){ JR_SEL=qd; const d=new Date(qd+'T00:00:00'); JR_CAL_YEAR=d.getFullYear(); JR_CAL_MONTH=d.getMonth(); JR_VIEW='calendar'; }
  await checkAuth();
  await loadJournal();
  setTimeout(()=>{ if(!document.getElementById('pin-ov')) jrOfferReminders(); }, 1500);
})();
// Everyone shares one calendar: every 10s, and whenever the app comes back to the front, fetch the events
// again and redraw only if someone changed something. Never mid-form, and never behind the PIN screen.
// While frozen this is also what notices the backend is back.
(function(){
  let busy=false;
  async function sync(){
    if(busy || JR_EVDRAG || document.hidden || document.querySelector('.modal-ov,#pin-ov')) return;
    busy=true;
    try{
      const fresh=await jrFetchEvents();
      if(JSON.stringify(fresh)!==JSON.stringify(JOURNAL_EVENTS)){ JOURNAL_EVENTS=fresh; jrRender(); }
    }catch(_){}
    busy=false;
  }
  setInterval(sync, 10000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) sync(); });
  addEventListener('focus', sync);
})();
</script>
<script>/* offline app shell (static/sw.js): registers only on a trusted certificate; a new version shows a tap-to-reload pill */
if("serviceWorker" in navigator&&window.isSecureContext&&!/[?&]nosw\b/.test(location.search)){
  addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").then(function(r){r.update().catch(function(){});}).catch(function(){});});
  /* an installed app is often brought back rather than opened anew (Android especially), and then the browser
     doesn't look for a new version for a day: look each time it comes back to the front */
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") navigator.serviceWorker.getRegistration().then(function(r){r&&r.update().catch(function(){});}); });
  /* a new version that lands in the first seconds after opening, before anything was touched, just loads: a home-screen app
   would otherwise open the previous copy every time after an update */
  ["pointerdown","keydown"].forEach(function(t){addEventListener(t,function(){window.__kTouched=1;},{once:true,capture:true});});
  navigator.serviceWorker.addEventListener("message",function(e){ if(!e.data||e.data.type!=="odin:updated"||document.getElementById("k-upd"))return;
    if(performance.now()<6000&&!window.__kTouched){location.reload();return;}
    var b=document.createElement("button");b.id="k-upd";b.type="button";b.textContent=typeof tx==="function"?tx("newVersion"):"New version — tap to reload";
    b.style.cssText="position:fixed;left:50%;top:calc(.7rem + env(safe-area-inset-top));transform:translateX(-50%);z-index:99;border:0;border-radius:999px;padding:.55rem 1rem;font:600 .85rem system-ui,sans-serif;background:#82aaff;color:#16182a;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer";
    b.onclick=function(){location.reload();};document.body.appendChild(b);});
}</script>
