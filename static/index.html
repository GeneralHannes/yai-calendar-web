<script>/* the app's language: the one chosen on this device, else the device's own (Khmer, Chinese), else English; set on <html lang> first so the right fonts load from the first paint */
(function(){var l="en";try{var s=localStorage.getItem("yai_lang");if(s==="en"||s==="zh"||s==="km")l=s;else{var n=navigator.languages||[navigator.language||"en"];for(var i=0;i<n.length;i++){var c=String(n[i]).toLowerCase();if(c.indexOf("km")===0){l="km";break}if(c.indexOf("zh")===0){l="zh";break}if(c.indexOf("en")===0)break}}}catch(e){}document.documentElement.lang=l})();</script>
<script>if(navigator.standalone)document.documentElement.classList.add("ios-app");
/* iPhone only (not iPad or Android): its own safe-area layout, see "iPhone" in the styles */
if(/iPhone|iPod/.test(navigator.userAgent))document.documentElement.classList.add("ios-phone");
/* Android: its Chrome misdraws live background blur (stale strips over the month header), so the glass there
   is drawn without it — see "Android" in the styles */
if(/Android/.test(navigator.userAgent))document.documentElement.classList.add("android");</script>
<script>/* light (Catppuccin Latte) unless this device chose another theme (Daylight is also defined: data-theme="daylight") */
try{var t=localStorage.getItem("sk_theme");document.documentElement.setAttribute("data-theme",t||"latte")}catch(e){document.documentElement.setAttribute("data-theme","latte")}</script>

/* iPhone home-screen app (status bar "black-translucent"): on a page shorter than the screen iOS sizes the page as if the
   status-bar strip weren't there, so everything pinned to the bottom sat ~55pt higher on short tabs (Find, Rate) than on
   long ones (Stock). Keeping every page at least screen + status bar tall pins the bottom to the same place everywhere. */
html.ios-app body { min-height:calc(100vh + env(safe-area-inset-top)); }
@media (display-mode:standalone) { body { min-height:calc(100vh + env(safe-area-inset-top)); } }

<style>
  :root { color-scheme:dark;
          --bg:#1e2030; --card:#222436; --card-2:#2f334d; --fill:#2f334d; --fill-2:#3b4261;
          --line:#3b4261; --ink:#c8d3f5; --muted:#828bb8;
          --accent:#82aaff; --accent-soft:color-mix(in srgb,var(--k-act) 18%,transparent); --good:#c3e88d; --warn:#ff966c;
          --good-soft:color-mix(in srgb,var(--k-money) 15%,transparent); --warn-soft:color-mix(in srgb,var(--k-warn) 16%,transparent);
          --nav:color-mix(in srgb,var(--k-bg1) 74%,transparent); --radius:14px; --radius-lg:18px; --shadow:0 2px 10px rgba(0,0,0,.4);
          --gold:#D4AF37;
          --bifrost:linear-gradient(90deg,#D4AF37,#D98A3C,#8FA6BF,#8B7BC4,#5A6FC0);
          /* same two materials as Odin's Vault: --glass (real blur) for the handful
             of bounded surfaces here (clock, table, floating bars); --pane (no
             blur) for the 42 calendar day cells, the one thing that repeats. */
          --glass:linear-gradient(to bottom,color-mix(in srgb,var(--k-bg2) 66%,transparent),color-mix(in srgb,var(--k-bg2) 48%,transparent));
          --pane:linear-gradient(to bottom,color-mix(in srgb,var(--k-bg2) 92%,transparent),color-mix(in srgb,var(--k-bg2) 80%,transparent));
          --glass-blur:saturate(180%) blur(20px);
          --glass-line:color-mix(in srgb,var(--k-ink) 11%,transparent);
          --glass-edge:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.32);
          --glass-lift:0 14px 38px -12px rgba(0,0,0,.62),0 2px 8px -3px rgba(0,0,0,.45);
          --ambient:radial-gradient(1200px 760px at 6% -12%,color-mix(in srgb,var(--k-act) 11%,transparent),transparent 60%),
                    radial-gradient(900px 640px at 104% 110%,color-mix(in srgb,var(--k-money) 5.5%,transparent),transparent 58%);
          --ease-out:cubic-bezier(.16,1,.3,1); --ease-spring:cubic-bezier(.34,1.4,.64,1);
          --ease-slide:cubic-bezier(.3,.8,.4,1); }
  * { box-sizing:border-box; }
  html { background:var(--bg); scroll-behavior:smooth; height:100%; }
  body { margin:0; background:transparent; color:var(--ink); min-height:100dvh;
         display:flex; flex-direction:column;
         font:17px/1.47 "Archivo",-apple-system,"SF Pro Text",system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:var(--ambient); }
  button,input,textarea { font:inherit; color:inherit }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  header { background:var(--glass); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
           border-bottom:1px solid var(--glass-line); box-shadow:var(--glass-edge);
           padding:.5rem .9rem; padding-top:max(.5rem, env(safe-area-inset-top));
           padding-left:max(.9rem, env(safe-area-inset-left)); padding-right:max(.9rem, env(safe-area-inset-right));
           display:flex; align-items:center; gap:.6rem; position:sticky; top:0; z-index:5; }
  header::after { content:""; position:absolute; left:0; right:0; bottom:0; height:2px;
                  background:var(--bifrost); background-size:200% 100%; opacity:.55; pointer-events:none;
                  animation:bifrost 18s ease-in-out infinite alternate; }
  @keyframes bifrost { to { background-position:-200% 0; } }
  .ident { display:flex; align-items:center; gap:.5rem; min-width:0; }
  .mark { flex:none; width:22px; height:22px; display:block; }
  header h1 { margin:0; font-family:Marcellus,"Iowan Old Style",Georgia,serif;
              font-size:.92rem; font-weight:400; letter-spacing:.09em; text-transform:uppercase;
              color:var(--gold); opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .back { flex:none; margin-left:auto; text-decoration:none; color:var(--accent); font-size:.82rem; font-weight:600;
          border:1px solid var(--glass-line); border-radius:8px; padding:.42rem .7rem; }
  .back:active { background:var(--fill); }
  @media (max-width:420px) { header h1 { font-size:.78rem; letter-spacing:.05em; } }

  .view-title { font-family:Marcellus,"Iowan Old Style",Georgia,serif; font-size:1.2rem;
                font-weight:400; letter-spacing:.005em; color:var(--ink); }
  .row { display:flex; gap:.5rem; align-items:center; }
  .muted { color:var(--muted); font-size:.9rem; }
  .empty { color:var(--muted); padding:.6rem .2rem; }
  .warn { color:var(--warn); } .good { color:var(--good); }
  input, select, textarea { font:inherit; font-size:1rem; padding:.6rem .75rem; border-radius:11px;
    width:100%; background:color-mix(in srgb,var(--k-bg3) 55%,transparent); color:var(--ink); border:1px solid var(--glass-line);
    box-shadow:var(--glass-edge); transition:box-shadow .15s, border-color .15s; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent);
    box-shadow:var(--glass-edge),0 0 0 3px var(--accent-soft); }
  input::placeholder, textarea::placeholder { color:var(--muted); opacity:.7; }
  input[type=checkbox] { width:auto; }
  .field { display:flex; flex-direction:column; gap:.28rem; flex:1 1 8rem; min-width:0; }
  .field > span { font-size:.74rem; color:var(--muted); font-weight:500; padding-left:.1rem; }
  button.act { background:var(--accent); color:#fff; border:none; padding:.62rem 1.1rem; border-radius:12px;
               cursor:pointer; font:inherit; font-size:1rem; font-weight:600;
               box-shadow:var(--glass-edge),0 6px 18px -8px color-mix(in srgb,var(--k-act) 55%,transparent);
               transition:opacity .15s, transform .2s var(--ease-spring); }
  button.act:hover { opacity:.9; } button.act:active { transform:scale(.96); }
  button.act:disabled { opacity:.4; cursor:default; }
  button.mini { border:1px solid var(--glass-line); background:color-mix(in srgb,var(--k-bg3) 50%,transparent); color:var(--accent);
                padding:.42rem .7rem; border-radius:9px; cursor:pointer; font-size:.88rem; font-weight:500;
                box-shadow:var(--glass-edge); transition:background-color .15s var(--ease-out), transform .2s var(--ease-spring); }
  button.mini:hover { background:var(--fill-2); }
  button.mini:active { transform:scale(.96); }
  .item-edit-actions { display:flex; gap:.5rem; justify-content:flex-end; margin-top:1rem; }
  @media (max-width:600px) { .item-edit-actions button { flex:1; } }
  .chip-lbl { background:var(--fill-2); border-radius:999px; padding:.1rem .5rem; }

  /* ---- photo-free modal dialogs (add event / day detail / askInput / askConfirm) ---- */
  /* dialogs cover what's visible of the screen (--vvt/--vvh: above the on-screen keyboard while it's open, set by
     the script under "keyboard"), on a solid card: forms read cleanly, with nothing showing through */
  .modal-ov { position:fixed; left:0; right:0; top:var(--vvt,0px); height:var(--vvh,100dvh); background:rgba(0,0,0,.5); z-index:25;
              display:flex; align-items:center; justify-content:center; padding:1rem;
              animation:overlayIn .22s ease both; }
  .modal-card { overscroll-behavior:contain; background:var(--k-bg2);
                border:1px solid var(--glass-line); box-shadow:var(--glass-edge),var(--glass-lift);
                border-radius:20px; max-width:min(26rem,calc(100vw - 2rem)); width:100%;
                max-height:calc(var(--vvh,100dvh) - 2rem); overflow:auto; overscroll-behavior:contain; touch-action:pan-y;
                padding:clamp(.85rem,3vw,1.2rem); animation:popIn .4s var(--ease-out) both; }
  /* phones: a sheet from the bottom edge, full width, that scrolls inside when the keyboard leaves it short of room */
  @media (max-width:560px) {
    .modal-ov { align-items:flex-end; padding:0; }
    .modal-card { max-width:100%; border-radius:20px 20px 0 0; border-bottom:0;
      max-height:calc(var(--vvh,100dvh) - env(safe-area-inset-top) - .75rem);
      padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom)); }
  }
  .modal-card h2 { font-family:Marcellus,"Iowan Old Style",Georgia,serif; font-weight:400; margin:0 0 .7rem; }
  @keyframes fadeIn { from{ opacity:0; } to{ opacity:1; } }
  @keyframes popIn  { from{ opacity:0; transform:scale(.94) translateY(8px); } to{ opacity:1; transform:none; } }
  @keyframes overlayIn { from{ opacity:0; } to{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important;
                             transition-duration:.001ms !important; scroll-behavior:auto !important; } }

  /* ---- Odin's Journal ---- */
  .jr-viewtoggle { display:flex; gap:.25rem; background:var(--fill); border-radius:10px; padding:3px; }
  .jr-vt-btn { border:none; background:transparent; color:var(--muted); border-radius:7px;
    padding:.5rem .75rem; cursor:pointer; font-size:.85rem; font-weight:600;
    transition:background-color .15s var(--ease-out), color .15s var(--ease-out); }
  .jr-vt-btn.active { background:var(--card); color:var(--accent); box-shadow:var(--shadow); }
  .jr-showpast { display:flex; align-items:center; gap:.35rem; font-size:.82rem; margin-left:auto; white-space:nowrap; }
  .jr-showpast input { width:auto; margin:0; }

  .jr-day-group { margin-bottom:1.1rem; }
  .jr-day-head { font-size:.95rem; font-weight:700; margin-bottom:.4rem; color:var(--ink); }
  .jr-day-head .rel { color:var(--accent); }
  .jr-table { display:grid; grid-template-columns:4.2rem 1fr 6rem 2.2rem 2.2rem; border-radius:12px; overflow:hidden;
    background:var(--glass); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-line); box-shadow:var(--glass-edge),var(--glass-lift); }
  .jr-table .jr-h { font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
    background:var(--fill); padding:.4rem .5rem; border-bottom:1px solid var(--line); }
  .jr-cell { padding:.55rem .5rem; border-bottom:1px solid var(--line); border-right:1px solid var(--line);
    font-size:.88rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;
    display:flex; align-items:center; transition:background-color .12s var(--ease-out); }
  .jr-cell:hover, .jr-cell:active { background:var(--fill); }
  .jr-cell.jr-time { font-variant-numeric:tabular-nums; color:var(--muted); }
  .jr-cell.jr-title { font-weight:600; }
  .jr-row.done .jr-title { color:var(--muted); text-decoration:line-through; }
  .jr-cell.jr-cat { font-size:.76rem; }
  .jr-cell.jr-check, .jr-cell.jr-del { justify-content:center; cursor:pointer; color:var(--muted); border-right:none; }
  .jr-cell.jr-check.done { color:var(--good); }
  .jr-cell.jr-del:hover { color:var(--warn); }
  .jr-row:last-child .jr-cell { border-bottom:none; }
  @media (max-width:640px) {
    .jr-table { grid-template-columns:3.6rem 1fr 2.2rem 2.2rem; }
    .jr-h.jr-h-cat, .jr-cell.jr-cat { display:none; }
  }

  .jr-cal-dow { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:.7rem;
    color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:.3rem; flex:none; }
  /* "move the date sheets down until the bottom tabs" — the grid stretches to
     fill whatever's left below the dow header, down to main's own bottom
     padding (which already clears the floating bars), instead of leaving a
     dead gap. grid-auto-rows:1fr splits that space evenly across whichever
     row count the current window has (5 or 6 weeks). */
  #jr-calendar { display:flex; flex-direction:column; flex:1; min-height:0; }
  .jr-cal-grid { display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; gap:.3rem; flex:1; min-height:0; }
  #toast { position:fixed; bottom:calc(1.4rem + var(--foot-h,0px) + env(safe-area-inset-bottom)); left:50%;

  /* ================= Odin's Keep — shared system (v2) =================
     IDENTICAL in static/index.html, pos.html and journal.html. Each app is a
     self-contained file by design (no shared stylesheet), so this block is
     copied, not imported — edit it in one file, paste it into the other two.
     Everything here is namespaced --k-* / .keep-* so it can't collide with an
     app's own tokens; each app maps its legacy names onto these just below.

     Palette: tokyonight moon, verbatim. A hue means one thing, everywhere:
       money green · quantity yellow · size cyan · price-tier teal ·
       category magenta · interaction blue · destructive red · warning orange.
     Gold is Odin's — the mark, the wordmark, today's date, curated shelves —
     and nothing else. The Bifrost hairline appears once, under the bar. */
  :root {
    --k-hi:#fff; --k-on-act:#10121f; --k-bg0:#191b29; --k-bg1:#1e2030; --k-bg2:#222436; --k-bg3:#2f334d; --k-bg4:#3b4261;
    --k-line:color-mix(in srgb,var(--k-ink) 10%,transparent); --k-line-2:color-mix(in srgb,var(--k-ink) 16%,transparent);
    --k-ink:#c8d3f5; --k-muted:#828bb8; --k-faint:#636da6;
    --k-money:#c3e88d; --k-qty:#ffc777; --k-size:#86e1fc; --k-tier:#4fd6be;
    --k-cat:#c099ff; --k-act:#82aaff; --k-bad:#ff757f; --k-warn:#ff966c;
    --k-act-soft:color-mix(in srgb,var(--k-act) 14%,transparent); --k-money-soft:color-mix(in srgb,var(--k-money) 13%,transparent);
    --k-warn-soft:color-mix(in srgb,var(--k-warn) 14%,transparent); --k-bad-soft:color-mix(in srgb,var(--k-bad) 14%,transparent);
    --k-gold:#d4af37; --k-gold-soft:rgba(212,175,55,.12);
    --k-bifrost:linear-gradient(90deg,#d4af37,#d98a3c,#8fa6bf,#8b7bc4,#5a6fc0);
    --k-font:"Archivo",-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --k-display:Marcellus,"Iowan Old Style",Georgia,serif;
    --k-r-sm:8px; --k-r:12px; --k-r-lg:16px;
    --k-lift:0 1px 0 rgba(255,255,255,.04) inset,0 10px 28px -14px rgba(0,0,0,.7);
    --ease-out:cubic-bezier(.16,1,.3,1); --ease-spring:cubic-bezier(.34,1.4,.64,1);
    --ease-slide:cubic-bezier(.3,.8,.4,1);
  }
  /* ---- the suite bar: brand + app switcher, same in all three apps ---- */
  .keep-bar { position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center;
    column-gap:.75rem; row-gap:0; background:color-mix(in srgb,var(--k-bg0) 86%,transparent);
    -webkit-backdrop-filter:saturate(160%) blur(18px); backdrop-filter:saturate(160%) blur(18px);
    padding:.5rem max(.9rem,env(safe-area-inset-right)) .5rem max(.9rem,env(safe-area-inset-left));
    padding-top:max(.5rem,env(safe-area-inset-top)); border-bottom:1px solid var(--k-line); }
  .keep-bar::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; pointer-events:none;
    background:var(--k-bifrost); background-size:200% 100%; opacity:.5;
    animation:keepBifrost 18s ease-in-out infinite alternate; }

  .keep-brand { display:flex; align-items:center; gap:.45rem; flex:none; min-width:0; text-decoration:none; }
  .keep-brand svg { width:22px; height:22px; flex:none; display:block; }
  .keep-word { font:400 .8rem/1 var(--k-display); letter-spacing:.16em; text-transform:uppercase;
    color:var(--k-gold); opacity:.9; white-space:nowrap; }
  /* The switcher doubles as the app's title: the current app is the lit
     segment, with its name; the others are one tap away. */
  .keep-switch { display:flex; align-items:center; gap:2px; flex:none; padding:3px; border-radius:11px;
    background:var(--k-bg0); border:1px solid var(--k-line); }
  .keep-switch a { display:flex; align-items:center; gap:.4rem; height:2.1rem; padding:0 .7rem; border-radius:8px;
    color:var(--k-muted); text-decoration:none; font:600 .86rem/1 var(--k-font); white-space:nowrap;
    transition:background-color .18s var(--ease-out), color .18s var(--ease-out), transform .15s var(--ease-spring); }
  .keep-switch a svg { width:1.05rem; height:1.05rem; flex:none; }

  /* ================= Odin's Keep — motion (shared, v2) =================
     IDENTICAL in index.html, pos.html and journal.html — edit once, paste
     into the other two. Modelled on iOS: real springs rather than generic
     ease curves, so things decelerate the way physical objects do and
     settle instead of stopping dead.
       --k-smooth  critically damped: panels, sheets, page content — no overshoot
       --k-snappy  ~2% overshoot: toggles, sliding highlights, small moves
       --k-bouncy  ~8% rebound: ONLY the spring-back when a press is released
       --k-ios     the iOS sheet curve, for things that slide a long way
       --k-exit    leaving is quicker and quieter than arriving
     Springs are sampled into CSS linear(); a browser without it (iOS < 17.2)
     falls back to the nearest cubic-bezier. The app's older three tokens
     (--ease-out / --ease-spring / --ease-slide) are re-pointed here, so every
     existing transition picks the springs up without being rewritten. */
  :root {
    --k-smooth:cubic-bezier(.2,.9,.25,1); --k-snappy:cubic-bezier(.25,1.1,.4,1); --k-bouncy:cubic-bezier(.3,1.35,.45,1);
    --k-ios:cubic-bezier(.32,.72,0,1); --k-exit:cubic-bezier(.4,0,.9,.6);
    --k-t-press:.09s; --k-t-quick:.28s; --k-t:.45s; --k-t-slow:.6s;
  }
  @supports (transition-timing-function:linear(0,1)) {
    :root {
      --k-smooth:linear(0, 0.025, 0.085, 0.165, 0.252, 0.341, 0.426, 0.505, 0.576, 0.64, 0.696, 0.744, 0.786, 0.822, 0.852, 0.877, 0.899, 0.916, 0.931, 0.944, 0.954, 0.962, 0.969, 0.975, 0.98, 0.983, 0.987, 0.989, 0.991, 0.993, 0.994, 0.995, 0.996, 0.997, 1);
      --k-snappy:linear(0, 0.031, 0.108, 0.21, 0.324, 0.438, 0.546, 0.643, 0.728, 0.8, 0.859, 0.906, 0.942, 0.97, 0.99, 1.003, 1.012, 1.017, 1.019, 1.02, 1.019, 1.017, 1.015, 1.013, 1.011, 1.009, 1.007, 1.005, 1.004, 1.003, 1.002, 1.001, 1.001, 1, 1);
      --k-bouncy:linear(0, 0.046, 0.158, 0.305, 0.462, 0.614, 0.748, 0.86, 0.947, 1.009, 1.05, 1.074, 1.083, 1.082, 1.074, 1.063, 1.05, 1.037, 1.025, 1.015, 1.007, 1.001, 0.997, 0.994, 0.993, 0.993, 0.993, 0.994, 0.995, 0.997, 0.998, 0.998, 0.999, 1, 1);
    }
  }

  @keyframes kFadeIn   { from { opacity:0; } }

  .k-press, button.act, button.mini, a.mini, .chip, .keep-switch a, .add-seg button, .add-kind-btn,

  /* ===== Themes — each only sets the --k-* palette; everything else (glass, tints, glows,

  /* Catppuccin Latte (catppuccin.com/palette): crust/mantle/base for the layers, surface0/1 for fills, text/subtext,

    --k-bg0:#dce0e8; --k-bg1:#e6e9ef; --k-bg2:#eff1f5; --k-bg3:#ccd0da; --k-bg4:#bcc0cc;

    --k-money:#40a02b; --k-qty:#df8e1d; --k-size:#04a5e5; --k-tier:#179299; --k-cat:#8839ef;
    --k-act:#1e66f5; --k-bad:#d20f39; --k-warn:#fe640b; --k-on-act:#eff1f5;
    --k-gold:#df8e1d; --gold:#df8e1d; --shot-a:#e6e9ef; --shot-b:#dce0e8;
    --glass-edge:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(76,79,105,.07);
    --glass-lift:0 14px 36px -16px rgba(76,79,105,.28),0 2px 8px -3px rgba(76,79,105,.14);
    --k-lift:0 1px 0 rgba(255,255,255,.7) inset,0 8px 22px -14px rgba(76,79,105,.32);

  /* ---- phone: the suite bar keeps just the logo; its app switcher lives in a strip along the bottom ---- */
  :root { --foot-h:0px; }
  #keepfoot { display:none; }
  @media (max-width:800px) {
    :root { --foot-h:3.8rem; --tap:2.9rem; }
    .foot-t { will-change:translate,scale; scale:1 calc(1 - var(--sq,0) * .22); transform-origin:50% 100%; }
    /* physics: under a fast scroll the bar squashes down onto the bottom edge and its contents squeeze in; a spring
       (driven by the scroll script) lets it rebound past rest and settle. --sq is set on the bars only, never :root. */
    .foot-t > * { scale:calc(1 - var(--sqi,0) * .14) calc(1 + var(--sqi,0) * .12); transform-origin:50% 100%; }
    /* and each tab's icon dips with it, then hops on the rebound */
    .foot-t > * > svg, .foot-t > * > .ic, .foot-t > * > a > svg { translate:0 calc(var(--sqi,0) * 5px); }
    html.foot-push .foot-t { transition:translate .18s cubic-bezier(.2,.8,.3,1); }
    html.foot-snap .foot-t { transition:translate .62s cubic-bezier(.34,1.45,.64,1); }   /* spring: overshoots a little and settles */
    @media (prefers-reduced-motion:reduce) { html.foot-push .foot-t, html.foot-snap .foot-t { transition:none; } }
    header.keep-bar .keep-switch { display:none; }
    #keepfoot { position:fixed; left:0; right:0; bottom:0; z-index:45; display:flex; align-items:center;
      justify-content:flex-start; height:calc(var(--foot-h) + env(safe-area-inset-bottom));
      padding:0 max(.6rem,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(1.6rem,env(safe-area-inset-left));
      background:color-mix(in srgb,var(--k-bg0) 86%,transparent);
      -webkit-backdrop-filter:saturate(160%) blur(18px); backdrop-filter:saturate(160%) blur(18px);
      border-top:1px solid var(--k-line); }
    /* the same strip as Odin's Vault (vault.css, the --tap pass): 46px targets, icon-only, 3.8rem tall — so the
       switcher doesn't change size or shape when you move between the apps */
    #keepfoot { gap:.35rem; }
    #keepfoot .keep-switch { gap:.25rem; }
    #keepfoot .keep-switch a { height:var(--tap); min-width:var(--tap); padding:0; border-radius:14px; justify-content:center; }
    #keepfoot .keep-switch a:not([aria-current="page"]) { padding:0; }
    #keepfoot .keep-switch a span { display:none; }
    #keepfoot .keep-switch a svg { width:22px; height:22px; }
    /* floating island, the same as Odin's Vault's app strip: shrink-wrapped, inset from the edges, on the right */
    body #keepfoot { left:auto; right:max(.6rem,env(safe-area-inset-right)); bottom:calc(.55rem + env(safe-area-inset-bottom));
      height:auto; padding:.25rem; border-radius:22px; border:1px solid var(--k-line);
      box-shadow:0 1px 0 color-mix(in srgb,#fff 6%,transparent) inset,0 16px 36px -14px rgba(0,0,0,.72),0 3px 10px -4px rgba(0,0,0,.45);
      background:var(--k-bg2); }
    :root { --foot-h:4.7rem; --tap:2.9rem; }   /* the island (~4rem) + its gap below: what the page keeps clear above it */
    /* right-hand bias: everything along the bottom sits where the right thumb rests */
    #keepfoot { justify-content:flex-end; padding-right:max(.8rem,env(safe-area-inset-right)); }
  }
  html.embedded { --foot-h:0px; }
  html.embedded #keepfoot { display:none !important; }
  /* taps always land: an overlay that is animating out never swallows them, and nothing waits on a double-tap check */
  .k-leaving, .k-leaving * { pointer-events:none !important; }
  button, a, summary, label, select, input[type="checkbox"], input[type="radio"], [onclick], [role="button"], .tile, .prod, .chip { touch-action:manipulation; }

  /* ---- performance: nothing repaints on an idle page ----
     The header's gold line animated background-position: a main-thread restyle + repaint 60 times a second,
     forever, on every page. Same look, now slid by transform (the GPU does it, the page does nothing).
     Rank and badge shimmers play when they appear, then rest, instead of repainting every frame forever. */
  .keep-bar, .top { overflow-x:clip; }
  .keep-bar::after, .top::after { right:auto; width:300%; background-size:66.667% 100%; background-repeat:repeat-x;
    animation:kbSlide 18s ease-in-out 2 alternate; will-change:transform; }   /* sweeps there and back once, then rests: an idle page does no work */
  @keyframes kbSlide { to { transform:translateX(-66.667%); } }
  @media (max-width:800px), (pointer:coarse) { .keep-bar::after, .top::after { animation:none; } }   /* phones: still gold line */
  .rank.rank-diamond, .b-holo { animation-iteration-count:2; }
  @media (prefers-reduced-motion:reduce) { .keep-bar::after, .top::after { animation:none; } }

  /* ================= Layout v3: side rail · month on top · selected day below ================= */
  html, body { height:100%; }

  @media (max-width:760px), (max-height:520px) and (orientation:landscape) {
    .jr-rail { width:4.1rem; padding:.7rem .45rem; padding-left:max(.45rem,env(safe-area-inset-left)); }
    .jr-rail span { display:none; }

  main { flex:1; min-width:0; min-height:0; max-width:none; margin:0; display:flex; flex-direction:column;
    padding:.8rem clamp(.6rem,2vw,1.4rem); padding-right:max(clamp(.6rem,2vw,1.4rem),env(safe-area-inset-right));
    padding-bottom:max(.8rem,env(safe-area-inset-bottom)); }

  .jr-split { flex:1; min-height:0; display:flex; flex-direction:column; gap:.75rem; }

  .jr-cal-head { display:flex; align-items:center; gap:.6rem; margin:0 0 .55rem; flex:none; }
  .jr-month { margin:0; flex:1; min-width:0; font:400 clamp(1.45rem,3.2vw,2.1rem)/1.1 var(--k-display); color:var(--ink);

    transition:background-color .2s ease, border-color .2s ease, box-shadow .25s ease, transform var(--k-t-slow) var(--k-bouncy); }

  @keyframes jrCell { from { opacity:0; transform:scale(.94); } }

  .jr-day-sum b { font-size:.9rem; color:var(--ink); margin-right:.2em; }

    display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr)); gap:.3rem .45rem; align-content:start; }

  /* event colours: the theme's eight, lightened (pastel), set once here so every event view and the colour balls

  @media (hover:hover) and (pointer:fine) { .jr-cal-day:hover, .jr-cal-day.sel:hover { transform:none; box-shadow:none; } }
  /* days of the next/previous month: dimmed, but their titles (which may run on into this month) stay readable */
  .jr-cal-day.other-month, .jr-cal-day.other-month.has-events { opacity:1; background:color-mix(in srgb,var(--k-bg0) 35%,transparent); }
  .jr-cal-day.other-month .jr-dhead { opacity:.4; }
  .jr-cal-day.other-month .jr-ev { opacity:.7; }
  .jr-cal-day.today:not(.sel) { border-color:var(--glass-line); }
  /* the picked day: a soft tint only, no outline */
  .jr-cal-day.sel, .jr-cal-day.sel:hover { border-color:var(--glass-line); background:color-mix(in srgb,var(--k-act) 14%,transparent);
    box-shadow:none; }
  .jr-cal-day.sel.other-month { background:color-mix(in srgb,var(--k-act) 10%,transparent); }
  .jr-glide { border-radius:0; box-shadow:none; background:color-mix(in srgb,var(--k-act) 14%,transparent); }   /* the tint glides to the new day */
  @media (max-width:760px) { .jr-glide { display:none; } }   /* phones: the tint just appears on the new day, no slide */
  /* joined squares can't pop or scale; they light up instead */
  @keyframes jrCellFade { from { opacity:0; } }
  .jr-cal-grid.wave .jr-cal-day { animation-name:jrCellFade; }
  @keyframes jrPickLight { from { background:color-mix(in srgb,var(--k-act) 38%,transparent); } }
  .jr-cal-day.pick { animation:jrPickLight .6s var(--k-smooth); }

  .jr-preview, .jr-preview.tight { overflow:visible; }
  .jr-ev, .jr-preview.tight .jr-ev { position:relative; z-index:2; display:block; width:max-content; min-width:0; max-width:var(--room,100%);
    white-space:nowrap; overflow:hidden; text-overflow:clip; -webkit-line-clamp:unset;
    background:color-mix(in srgb,var(--k-act) 30%,var(--k-bg2)); box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .jr-ev.wrap { white-space:normal; overflow-wrap:break-word; }      /* longer than its day: onto more lines */
  .jr-ev.cut { text-overflow:ellipsis; }                               /* …or, short of rows, one line ending "…" */
  .jr-ev.cut .jr-ev-t, .jr-ev.clamp .jr-ev-t { display:none; }        /* squeezed: the title matters more than the time */
  #jr-cal-grid .jr-ev.clamp { white-space:normal; overflow-wrap:break-word; display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; }
  /* a multi-day event: a bar locked from its first day to its last (width set by jrFitCells), one line, "…" if the
     title is longer; a stronger fill so it reads as a span, square ends where it carries on into the next row */
  #jr-cal-grid .jr-ev.span { max-width:none; white-space:nowrap !important; overflow:hidden; text-overflow:ellipsis;
    display:block; -webkit-line-clamp:unset; color:var(--ink);   /* dark text, like the one-day events */
    background:color-mix(in srgb,var(--k-act) 55%,var(--k-bg2)); border-left-color:color-mix(in srgb,var(--k-act) 75%,#000); }
  /* split over two rows, it still reads as one: the piece that carries on ends in an arrow point, the piece it carries
     on into starts with the matching notch on the same line, and touching either lights up both (.linked) */
  #jr-cal-grid .jr-ev.span.cont-r { border-top-right-radius:0; border-bottom-right-radius:0; padding-right:10px;
    clip-path:polygon(0 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 0 100%); }
  #jr-cal-grid .jr-ev.span.cont-l { border-top-left-radius:0; border-bottom-left-radius:0; border-left-color:transparent; padding-left:10px;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 6px 50%); }
  #jr-cal-grid .jr-ev.span.cont-l.cont-r { clip-path:polygon(0 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 0 100%, 6px 50%); }
  #jr-cal-grid .jr-ev.span.linked { background:color-mix(in srgb,var(--k-act) 72%,var(--k-bg2)); }
  /* the days a multi-day event covers: a soft tint for the ones through the selected day, stronger while its bar is
     hovered or pressed (jrSpanCells) */
  #jr-cal-grid .jr-cal-day.span-sel:not(.sel) { background:color-mix(in srgb,var(--k-act) 8%,transparent); }
  #jr-cal-grid .jr-cal-day.span-hover:not(.sel) { background:color-mix(in srgb,var(--k-act) 16%,transparent); }
  #jr-cal-grid .jr-ev.span.done.linked { background:color-mix(in srgb,var(--muted) 38%,var(--k-bg2)); }
  #jr-cal-grid .jr-ev.span.done { color:var(--muted); background:color-mix(in srgb,var(--muted) 22%,var(--k-bg2)); }
  /* event text scales with its day square (cqi = 1% of the square's width): about 10.5px in a phone's narrow
     squares, growing to about 16px in a monitor's wide ones, so titles are neither tiny on a big screen nor
     crammed on a small one. Long words hyphenate ("Sup-plier") instead of breaking anywhere. */
  #jr-cal-grid .jr-ev { font-size:clamp(.66rem, 3px + 7.5cqi, 1.05rem); line-height:1.22; padding:.14em .38em .14em .42em; }
  /* words break only at spaces, never inside a word (jrFitWords sizes an event's text so its longest word fits) */
  #jr-cal-grid .jr-ev.wrap, #jr-cal-grid .jr-ev.clamp { overflow-wrap:normal; word-break:normal; -webkit-hyphens:manual; hyphens:manual; }
  #jr-cal-grid .jr-ev.hy { overflow-wrap:break-word; -webkit-hyphens:auto; hyphens:auto; }
  #jr-cal-grid .jr-ev.abbr { letter-spacing:.02em; overflow-wrap:normal; -webkit-hyphens:manual; hyphens:manual; }   /* initials never split */   /* initials ("PPTF 2026"): a touch of air between the letters */   /* the rare word too long for its day */
  /* phones: the squares can't get wider, so their insides give the titles the room: thinner padding in the
     square and in the event, a thinner edge */
  @container (max-width:74px) { #jr-cal-grid .jr-ev:not(.span) { padding:.12em .22em .12em .3em; border-left-width:2px; } }
  /* a narrow square (a phone): a wrapped event's time gets its own line, so the title starts on a fresh one */
  @container (max-width:74px) { #jr-cal-grid .jr-ev.wrap .jr-ev-t { display:block; margin-right:0; } }
  .jr-ev.done { background:color-mix(in srgb,var(--muted) 14%,var(--k-bg2)); }
  .jr-ev-gap { display:block; flex:none; pointer-events:none; }      /* a row kept free for a title running in from the left */
  /* the time leads the title, short ("9:00"), a lighter tint so the title still reads first */
  .jr-ev-t { font-weight:700; font-variant-numeric:tabular-nums; color:color-mix(in srgb,var(--accent) 70%,var(--k-hi)); margin-right:.3em; }
  .jr-ev.done .jr-ev-t { color:inherit; }
  @container (max-width:74px) {
    /* phones: big enough to read at arm's length — larger, bolder, bright text on a stronger fill with a fine
       edge — while the rows stay tight enough that a square still holds a few */
    .jr-ev, .jr-preview.tight .jr-ev { display:block; white-space:nowrap; -webkit-line-clamp:unset; overflow-wrap:normal; hyphens:manual;
      font-size:.76rem; font-weight:650; line-height:1.22; letter-spacing:-.01em; padding:2px 5px; border-radius:5px;
      color:var(--k-hi); background:color-mix(in srgb,var(--k-act) 44%,var(--k-bg2));
      box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k-hi) 10%,transparent), 0 1px 3px rgba(0,0,0,.3); }
    .jr-ev.done { color:var(--muted); background:color-mix(in srgb,var(--muted) 16%,var(--k-bg2)); }
    .jr-ev-t { color:color-mix(in srgb,var(--accent) 45%,var(--k-hi)); }
    .jr-ev.wrap { white-space:normal; overflow-wrap:break-word; }
    .jr-preview { gap:1px; }
    .jr-daynum { font-size:.82rem !important; min-width:1.3rem !important; height:1.3rem !important; }
  }
  @media (max-width:560px) { .jr-cal-day { padding:3px 1px 2px 2px; gap:1px; } }

  /* ================= liquid glass bead (Odin's Keep's tab bar; script: jrBead) ================= */
  .jr-beadbar { position:relative; isolation:isolate; touch-action:none; -webkit-user-select:none; user-select:none; }
  .jr-beadbar > button { position:relative; z-index:1; transition:scale .3s var(--ease-spring), color .2s; }
  .jr-beadbar > .active { background:transparent !important; box-shadow:none !important; }
  .jr-bead { position:absolute; left:0; top:0; width:0; height:0; z-index:0; pointer-events:none; opacity:0; border-radius:10px;
    background:color-mix(in srgb,var(--k-act) 16%,transparent);
    border:1px solid color-mix(in srgb,var(--k-hi) 14%,transparent);
    box-shadow:inset 0 1px 1px color-mix(in srgb,var(--k-hi) 24%,transparent), inset 0 -3px 8px -3px color-mix(in srgb,var(--k-act) 35%,transparent),
      0 6px 18px -8px rgba(0,0,0,.55);
    transition:translate .6s var(--ease-spring), width .6s var(--ease-spring), height .5s var(--ease-spring), opacity .2s, background-color .25s, box-shadow .25s; }
  .jr-monthnav .jr-bead { border-radius:999px; }
  .jr-beadbar > .jr-bead { display:block; }        /* the phone rail hides its <span> labels; not this one */
  .jr-bead.on { opacity:1; }
  .jr-bead.drag { background:color-mix(in srgb,var(--k-hi) 9%,transparent);
    -webkit-backdrop-filter:blur(1.5px) saturate(1.8) brightness(1.15); backdrop-filter:blur(1.5px) saturate(1.8) brightness(1.15);
    box-shadow:inset 0 1px 1px color-mix(in srgb,var(--k-hi) 45%,transparent), inset 0 0 0 1px color-mix(in srgb,var(--k-hi) 10%,transparent),
      inset 0 -6px 14px -6px color-mix(in srgb,var(--k-act) 45%,transparent), 0 12px 28px -8px rgba(0,0,0,.6);
    transition:translate .07s linear, width .22s ease-out, height .22s ease-out, opacity .15s, background-color .2s, box-shadow .2s; }
  .jr-bead.flash { animation:jrBeadFlash .38s var(--k-smooth) both; }
  @keyframes jrBeadFlash { from { opacity:0; scale:.8; } 40% { opacity:1; scale:1.08; } to { opacity:0; scale:1; } }
  .jr-bead.no-anim { transition:none; }
  .jr-beadbar.liquid > button.bead-under { scale:1.12; color:var(--k-hi); }
  .jr-viewtoggle .jr-vt-btn.active { color:var(--accent); }

  /* ================= touch shine (script: k-shine) =================
     a soft highlight where the finger or mouse is, under the content, inside the surface */
  .k-shine { position:relative; isolation:isolate; }
  .k-shine::before { content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; pointer-events:none; opacity:0;
    background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.11), transparent 62%);
    transition:opacity .35s ease; }
  .k-shine.shining::before { opacity:1; transition-duration:.12s; }
  .jr-add.k-shine::before { background:radial-gradient(120px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.4), transparent 65%); }

  /* ================= views come in from the side you came from (Odin's Keep's tab motion) ================= */
  @keyframes jrViewU { from { opacity:0; transform:translateY(22px); } }
  @keyframes jrViewD { from { opacity:0; transform:translateY(-22px); } }
  #jr-agenda.vin-u, #jr-calendar.vin-u { animation:jrViewU var(--k-t) var(--k-smooth) both; }
  #jr-agenda.vin-d, #jr-calendar.vin-d { animation:jrViewD var(--k-t) var(--k-smooth) both; }

  /* ================= the big day number: struck gold with a glint (Odin's Keep's metal text) ================= */
  @supports ((-webkit-background-clip:text) or (background-clip:text)) {
    .jr-day-big { background-image:linear-gradient(100deg,#b8901f 0%,#f3d36b 28%,#fff6cf 44%,#e9c14a 60%,#a47c12 80%,#e6c35a 100%);
      background-size:250% 100%; background-position:0% 0; -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 8px rgba(212,175,55,.35)); }
    .jr-bottom.enter .jr-day-big { animation:jrNumIn .5s var(--k-bouncy) both, kGlint 1.6s ease-in-out .25s both; }
    /* light: a deeper gold, so it reads on white */
    :root[data-theme="latte"] .jr-day-big { background-image:linear-gradient(100deg,#b8650a 0%,#df8e1d 28%,#f2be6a 44%,#d0820f 60%,#a85a06 80%,#df8e1d 100%);
      filter:drop-shadow(0 1px 0 rgba(255,255,255,.6)); }
    :root[data-theme="daylight"] .jr-day-big { background-image:linear-gradient(100deg,#7a5a05 0%,#b8901f 28%,#e0b94a 44%,#a47c12 60%,#6e5004 80%,#9a7608 100%);
      filter:drop-shadow(0 1px 0 rgba(255,255,255,.6)); }
  }
  /* light: the "Coming up" heading sits on the panel's own glass, not a grey band */
  :root[data-theme="daylight"] .jr-up-head, :root[data-theme="latte"] .jr-up-head { background:none; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  @keyframes kGlint { from { background-position:0% 0; } to { background-position:100% 0; } }

  /* ================= dragging an event to another day (script: drag an event) ================= */
  #jr-cal-grid .jr-ev[data-id] { touch-action:none; cursor:grab; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #jr-cal-grid .jr-ev.dragging { opacity:.25; }
  .jr-ev-ghost { position:fixed !important; z-index:80; pointer-events:none; margin:0; max-height:none; overflow:visible;
    cursor:grabbing; white-space:nowrap !important; transform-origin:20% 50%;
    box-shadow:0 14px 30px -8px rgba(0,0,0,.65), 0 0 0 1px color-mix(in srgb,var(--k-hi) 25%,transparent), 0 0 18px -2px color-mix(in srgb,var(--k-act) 55%,transparent);
    animation:jrPickUp .22s var(--k-bouncy) both; }
  @keyframes jrPickUp { from { scale:1; rotate:0deg; } to { scale:1.12; rotate:-2deg; } }
  body.jr-dragging, body.jr-dragging * { cursor:grabbing !important; }
  .jr-cal-day.drop-target { background:color-mix(in srgb,var(--k-act) 26%,transparent) !important;
    box-shadow:inset 0 0 0 2px var(--accent), inset 0 0 22px -4px color-mix(in srgb,var(--k-act) 60%,transparent) !important; }
  .jr-cal-day.drop-target .jr-daynum { scale:1.15; transition:scale .2s var(--ease-spring); }
  @keyframes jrLanded { 0% { scale:1.25; filter:brightness(1.6); } 100% { scale:1; filter:none; } }
  #jr-cal-grid .jr-ev.landed { animation:jrLanded .5s var(--k-bouncy); transform-origin:left center; }

  /* ================= phones held upright: the side menu becomes floating glass bars at the bottom =================
     Like Odin's Keep's tab bar, one line under the thumb: Calendar / Agenda on the left, and on the right the
     month bar and Add event joined into one pill — ‹ Today › + (jrPhoneBar moves the two in there). In Agenda
     the month arrows step aside and just + stays. The month gets the full width. Phones on their side and
     desktop keep the side menu: on a phone's side, height is what's short. */
  @media (max-width:760px) and (orientation:portrait) {
    .jr-rail { position:fixed; z-index:25; top:auto; left:max(.6rem,env(safe-area-inset-left)); right:max(.6rem,env(safe-area-inset-right));
      bottom:max(.6rem,env(safe-area-inset-bottom)); width:auto; flex-direction:row; align-items:center; justify-content:space-between;
      gap:.5rem; padding:0; border:0; background:none; box-shadow:none; pointer-events:none;   /* only the pills take taps */
      animation:jrBarRise var(--k-t) var(--k-smooth) .05s both; }
    .jr-rail > * { pointer-events:auto; }
    .jr-rail .jr-viewtoggle { flex-direction:row; gap:.1rem; padding:.3rem; border-radius:999px;
      border:1px solid var(--glass-line); background:var(--glass); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
      box-shadow:var(--glass-edge),var(--glass-lift); }
    /* thumb-sized: ~50px tall (Apple's 44pt and then some), bigger icons and Today */
    .jr-rail { left:max(.45rem,env(safe-area-inset-left)); right:max(.45rem,env(safe-area-inset-right)); gap:.4rem; }
    .jr-rail .jr-vt-btn { width:3.2rem; height:3.1rem; padding:0; justify-content:center; border-radius:999px; }
    .jr-rail .jr-vt-btn svg { width:24px; height:24px; }
    .jr-viewtoggle .jr-bead { border-radius:999px; }
    .jr-rail .jr-monthnav { margin-left:auto; animation:none; gap:.25rem; flex:none; }
    .jr-monthnav .jr-mn-btn { width:2.6rem; height:3.1rem; }
    .jr-monthnav .jr-mn-btn svg { width:23px; height:23px; }
    .jr-monthnav .jr-mn-today { height:3.1rem; padding:0 .95rem; font-size:1.02rem; }
    .jr-rail .jr-monthnav .jr-add { width:3.1rem; height:3.1rem; }
    .jr-rail .jr-monthnav .jr-add svg { width:25px; height:25px; }
    /* the month and the day can trade places (jrSwapPanels) */
    body.jr-dayfirst .jr-bottom { order:-1; margin-top:0; margin-bottom:calc(var(--grow) * -1); }
    .jr-day-headrow .jr-swap { display:grid; }
    /* rigid: the month and the day fit the screen exactly and nothing scrolls or bounces. iOS rubber-bands a
       page even when it fits, so the page itself is pinned; in the calendar the browser gets no panning at all
       (swipes, taps and dragging events are all handled by the app). The Agenda list still scrolls. */
    html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
    body { position:fixed; inset:0; width:100%; }
    /* exactly the screen, also as an installed app: the older home-screen rule (min-height: screen + notch,
       from Odin's Keep) made the page taller than the screen and pushed the day panel under the tabs */
    body, html.ios-app body { min-height:0; }
    /* …but the installed iPhone app needs the document itself at least screen + status bar tall (see the
       home-screen note at the top of the styles): exactly-screen-tall, iOS cuts a status-bar-high strip off
       the bottom and nothing pinned can reach it. The page is still pinned, so this doesn't scroll anything. */
    html.ios-app { height:auto; min-height:calc(100vh + env(safe-area-inset-top)); }
    #jr-calendar, .jr-top, .jr-bottom, .jr-rail { touch-action:none; }
    #jr-agenda { touch-action:pan-y; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
    main { padding:.6rem .6rem calc(4.5rem + max(.6rem,env(safe-area-inset-bottom))); }
    #jr-agenda { padding-bottom:1rem; }
    #toast { bottom:calc(5rem + env(safe-area-inset-bottom)); }
    #jr-frozen-bar { max-width:calc(100vw - 1rem); }
  }
  @keyframes jrBarRise { from { opacity:0; transform:translateY(18px) scale(.96); } }
  /* ‹ Today › + : Add event inside the month bar (jrPhoneBar puts it there on phones held upright and on desktop) */
  .jr-monthnav .jr-add { margin:0 0 0 .15rem; width:2.6rem; height:2.6rem; padding:0; border-radius:999px; flex:none;
    display:grid; place-items:center; color:var(--k-on-act); }
  .jr-monthnav .jr-add svg { width:22px; height:22px; }
  .jr-monthnav .jr-add span { display:none; }
  body:not(.jr-cal-view) .jr-monthnav > button:not(.jr-add):not(.jr-scan) { display:none; }   /* Agenda and People: just the photo button and + */
  main > .jr-monthnav { margin-top:.75rem; }                                       /* desktop: under the open view */
  .jr-swap { display:none; flex:none; margin-left:auto; place-items:center; width:2.3rem; height:2.3rem; border-radius:999px; cursor:pointer;
    color:var(--muted); background:color-mix(in srgb,var(--k-bg3) 50%,transparent); border:1px solid var(--glass-line); box-shadow:var(--glass-edge);
    transition:color .2s, background-color .2s, rotate .45s var(--ease-spring), scale .15s; }
  .jr-swap svg { width:18px; height:18px; }
  .jr-swap:active { scale:.9; }
  body.jr-dayfirst .jr-swap { rotate:180deg; color:var(--accent); }
  /* very narrow phones: the same line, a little tighter */
  @media (max-width:359px) and (orientation:portrait) {
    .jr-rail .jr-vt-btn { width:2.7rem; }
    .jr-monthnav .jr-mn-btn { width:2.2rem; }
    .jr-monthnav .jr-mn-today { padding:0 .6rem; font-size:.95rem; }
    .jr-rail .jr-monthnav .jr-add { width:2.9rem; height:2.9rem; }
  }

  /* ================= desktop: "Coming up" in the side menu (script: jrRenderUpNext) =================
     The empty space under Calendar / Agenda lists what's ahead: month headings, then each day (big date,
     weekday, Today/Tomorrow), then its events with time, title and a line of category and notes. It scrolls
     on its own; the menu widens a little to fit it. Phones never show it. */
  .jr-upnext { display:none; }
  @media (min-width:761px) and (min-height:521px) {
    /* desktop: the month's event chips show just the title (the time is in the day panel and Coming up) */
    .jr-preview .jr-ev-t { display:none; }
    .jr-rail { width:16rem; }
    .jr-upnext { display:block; flex:1 1 0; min-height:0; overflow-y:auto; overscroll-behavior:contain; margin:.1rem -.3rem 0; padding:0 .3rem .6rem;
      scrollbar-width:thin; scrollbar-color:var(--glass-line) transparent;
      -webkit-mask-image:linear-gradient(transparent, #000 .6rem, #000 calc(100% - 1.4rem), transparent);
              mask-image:linear-gradient(transparent, #000 .6rem, #000 calc(100% - 1.4rem), transparent); }
    .jr-rail .jr-add { margin-top:.2rem; }
    /* the phone's floating glass, on desktop: the side menu is a glass panel standing off the edges rather than
       a flat strip, Calendar / Agenda a glass pill inside it like the phone's bar, and it rises in the same way */
    .jr-rail { margin:.7rem 0 .7rem .7rem; margin-left:max(.7rem,env(safe-area-inset-left)); padding:.6rem;
      border:1px solid var(--glass-line); border-radius:22px;
      background:var(--glass); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
      box-shadow:var(--glass-edge),var(--glass-lift); animation:jrPanelRise .55s var(--k-smooth) .05s both; }
    .jr-rail .jr-viewtoggle { padding:.3rem; border-radius:16px; gap:.15rem;
      background:color-mix(in srgb,var(--k-bg0) 40%,transparent); border:1px solid var(--glass-line); box-shadow:inset 0 1px 3px rgba(0,0,0,.3); }
    .jr-rail .jr-vt-btn { border-radius:12px; }

  /* ================= iPhone only (script in <head> adds html.ios-phone) =================
     The page runs edge to edge (viewport-fit=cover): it reaches under the status bar and the home indicator.
     The safe areas are read once into variables, and the layout takes everything the notch and the indicator
     don't need:
       top    — the status-bar band is the (glass) top bar itself, with no extra padding under it;
       bottom — the floating bars sit just clear of the home indicator (it lives in the lowest ~13pt, so they
                start at half the inset, ~17pt, not a full 34pt up), and the month and day panel run down
                to just above them. Each home-indicator iPhone gains about 25px of calendar.
     Android, iPad and desktop are untouched. */
  html.ios-phone { --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);

    html.ios-phone main { padding-top:.3rem; padding-bottom:calc(3.8rem + var(--bar-b) + .4rem); }
    html.ios-phone .jr-rail { bottom:var(--bar-b); }
    html.ios-phone #toast { bottom:calc(var(--bar-b) + 4.3rem); }
    html.ios-phone #jr-remind { bottom:calc(var(--bar-b) + 4.4rem); }

  /* on its side: the notch is at one edge (the side menu and calendar already clear it), only the home
     indicator is below — claim half of it */
  @media (max-height:520px) and (orientation:landscape) {

    html.ios-phone .jr-rail { padding-bottom:max(.6rem, calc(var(--sab) * .5)); }
  }

// ---- Odin's Keep motion helpers (shared, identical in all three apps) ----
// dismiss(): play an overlay's exit before removing it. The id is dropped at
// once, so code that reopens the same dialog never finds the leaving copy.
const K_REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
function dismiss(el, ms){
  if(!el || el.dataset.kLeaving) return;
  el.dataset.kLeaving='1'; el.removeAttribute('id'); el.style.pointerEvents='none';
  if(K_REDUCED.matches){ el.remove(); return; }
  el.classList.add('k-leaving'); setTimeout(()=>el.remove(), ms||230);
}
// kThumb(): a segmented control's highlight slides to the active option
// instead of jumping. Any element with data-k-thumb gets one; a
// MutationObserver follows the .active class, so call sites don't change.
function kThumb(box){
  let th=box.querySelector(':scope > .k-thumb');
  const line=box.dataset.kThumb==='line';
  if(!th){
    th=document.createElement('span'); th.className='k-thumb'+(line?' k-line':''); box.prepend(th);
    box.classList.add('k-thumbed');
    new MutationObserver(ms=>{ if(ms.some(m=>m.target!==th)) requestAnimationFrame(()=>kThumb(box)); })
      .observe(box,{subtree:true,attributes:true,attributeFilter:['class','style','aria-current']});
    // also re-measure when the control itself appears or resizes (a tab that was hidden at load)
    if(window.ResizeObserver) new ResizeObserver(()=>kThumb(box)).observe(box);
  }
  const act=box.querySelector(':scope > .active, :scope > [aria-current="page"]');
  // read every measurement first, then write: interleaving them forces a fresh layout per read
  const w=act?act.offsetWidth:0, h=w?act.offsetHeight:0, x=w?act.offsetLeft:0, y=w?act.offsetTop:0;
  if(!w){ th.style.opacity='0'; return; }
  const inset=line?10:0, first=!box.classList.contains('k-ready');
  if(first) th.style.transition='none';
  th.style.width=(w-2*inset)+'px';
  if(!line) th.style.height=h+'px';
  th.style.transform=`translate(${x+inset}px,${line?y+h-5:y}px)`;
  th.style.opacity='1';
  // first placement lands without sliding; transitions come back after it has painted (no forced layout)
  if(first){ box.classList.add('k-ready'); requestAnimationFrame(()=>requestAnimationFrame(()=>{ th.style.transition=''; })); }
}
function kThumbs(){ document.querySelectorAll('[data-k-thumb]').forEach(kThumb); }
addEventListener('resize', ()=>kThumbs());
addEventListener('load', ()=>kThumbs());
if(document.fonts) document.fonts.ready.then(()=>kThumbs());

// "10 Oct" · "10月10日" · "10 តុលា"
const jrFmtDM=d=>JR_LANG==='zh' ? `${d.getMonth()+1}月${d.getDate()}日` : `${d.getDate()} ${jrMonShort(d.getMonth())}`;
// "Sat 10 Oct" · "10月10日 周六" · "សៅរ៍ 10 តុលា"
const jrFmtShort=d=>JR_LANG==='zh' ? `${jrFmtDM(d)} ${jrDayAbbr(d.getDay())}` : `${jrDayAbbr(d.getDay())} ${jrFmtDM(d)}`;
// "Saturday 10 October" · "10月10日 星期六" · "ថ្ងៃសៅរ៍ 10 តុលា"
const jrFmtLong=d=>JR_LANG==='zh' ? `${d.getMonth()+1}月${d.getDate()}日 ${jrDayName(d.getDay())}` : `${jrDayName(d.getDay())} ${d.getDate()} ${jrMonth(d.getMonth())}`;
// "November 2026" · "2026年11月" · "វិច្ឆិកា 2026"
const jrFmtMY=d=>JR_LANG==='zh' ? `${d.getFullYear()}年${d.getMonth()+1}月` : `${jrMonth(d.getMonth())} ${d.getFullYear()}`;
// the month title's two parts (the page puts the year in gold beside the month)
const jrCalTitle=(y,m)=>JR_LANG==='zh' ? [`${m+1}月`, `${y}年`] : [jrMonth(m), String(y)];

// ---- where the data lives: ONE setting, so the backend can be swapped ----
// JR_API is the backend's address ('' = the server this page came from, or on a static host with no
// server, this device only). It comes from, in order:
//   1. ?api=https://… in the link (remembered on this device; ?api=reset forgets it),
//   2. static/config.json  {"api": "https://…"}  — what `bun run public` writes for the GitHub site,
//   3. nothing: ''.
let JR_API='';
async function jrResolveApi(){
  try{
    const q=new URLSearchParams(location.search).get('api');
    if(q==='reset') localStorage.removeItem('journal_api');
    else if(q) localStorage.setItem('journal_api', q.replace(/\/+$/,''));
    const kept=localStorage.getItem('journal_api');
    if(kept){ JR_API=kept; return; }
  }catch(_){}
  try{
    const r=await fetch('static/config.json?'+Date.now(), {cache:'no-store'});
    if(r.ok){ const c=await r.json(); JR_API=(c.api||'').trim().replace(/\/+$/,''); }
  }catch(_){}
}
const jrUrl = path => JR_API + path;

// ---- frozen copy: the last events this device loaded, kept so nothing recorded ever disappears ----
// When the backend can't be reached (switched off, moved, no signal) the calendar shows this copy,
// read-only, until the backend answers again.
const JR_SNAP_KEY='journal_snapshot';
let JR_FROZEN=false;
function jrSaveSnapshot(events){ try{ localStorage.setItem(JR_SNAP_KEY, JSON.stringify({at:new Date().toISOString(), api:JR_API, events})); }catch(_){} }
// only the copy taken from the backend in use now: never show one backend's events as another's
function jrSnapshot(){ try{ const s=JSON.parse(localStorage.getItem(JR_SNAP_KEY)); return s && s.api===JR_API ? s : null; }catch(_){ return null; } }
function jrFreeze(on){
  if(JR_FROZEN===on) return;
  JR_FROZEN=on;
  document.body.classList.toggle('jr-frozen', on);
  let b=document.getElementById('jr-frozen-bar');
  if(on){
    if(!b){ b=document.createElement('div'); b.id='jr-frozen-bar'; b.setAttribute('role','status'); document.body.appendChild(b); }
    b.innerHTML=jrFrozenHtml();
  } else if(b){ b.classList.add('leaving'); setTimeout(()=>b.remove(), 260); toast(tx('backOnline')); }
}
function jrFrozenHtml(){
  const s=jrSnapshot(), when=s?.at?new Date(s.at).toLocaleString(JR_LANG==='zh'?'zh-CN':JR_LANG==='km'?'km-KH':[], {dateStyle:'medium', timeStyle:'short'}):null;
  return tx('frozen',{when:when?esc(when):''});
}
class JrOffline extends Error {}

async function api(path, opts={}){
  const method=(opts.method||'GET').toUpperCase();
  if(method!=='GET' && /^\/api\/journal\//.test(path) && JR_USER && !jrCanEdit()){ toast(tx('viewOnly')); throw new Error('this account can only view'); }
  if(JR_FROZEN && method!=='GET'){ toast(tx('offlinePaused')); throw new JrOffline('offline'); }
  opts.headers = Object.assign({}, opts.headers||{}, TOKEN?{'X-Token':TOKEN}:{});
  let r;
  try{ r = await fetch(jrUrl(path), opts); }
  catch(e){ throw new JrOffline('cannot reach the server'); }        // network down, server or tunnel gone
  if(r.status>=502 && r.status<=530) throw new JrOffline('server offline (HTTP '+r.status+')');   // the tunnel answers, the server doesn't
  if(r.status===401){ jrSetSession('', null); askToken(); throw new Error('please sign in'); }
  if(r.status===403 && JR_USER){ let d; try{ d=(await r.clone().json()).detail; }catch(_){} if(/password change required/i.test(d||'')){ jrChangePassword(true); throw new Error('password change required'); } }
  if(r.status===429){ toast(tx('tooMany')); throw new Error('locked out for a while'); }
  if(!r.ok){ let d; try{ d=(await r.json()).detail; }catch(_){} throw new Error(d || r.statusText); }
  return r.json();
}
// Every event read goes through here: fresh from the backend (and saved as the frozen copy), or, if the
// backend can't be reached, the frozen copy.
async function jrFetchEvents(){
  try{
    const events=await api('/api/journal/events');
    jrSaveSnapshot(events); jrFreeze(false);
    return events;
  }catch(e){
    if(!(e instanceof JrOffline)) throw e;
    jrFreeze(true);
    return jrSnapshot()?.events || JOURNAL_EVENTS || [];
  }
}

function jrSetSession(token, user){

// a password typed into a small on-page box (or null if cancelled)
function jrAskPassword(msg, yes){
  return new Promise(resolve=>{
    const ov=document.createElement('div'); ov.className='modal-ov'; ov.style.zIndex=70;
    const card=document.createElement('form'); card.className='modal-card'; card.style.cssText='max-width:22rem;width:100%';
    card.innerHTML=`<p style="margin:0 0 .7rem;line-height:1.4">${esc(msg)}</p>

      <div class="item-edit-actions"><button type="button" class="mini" data-x>${esc(tx('cancel'))}</button><button class="act" type="submit">${esc(yes||tx('ok'))}</button></div>`;
    ov.appendChild(card); document.body.appendChild(ov);

// change the password: the current one and the new one twice. `forced`: the account must, so nothing else shows yet
function jrChangePassword(forced){
  if(document.getElementById('pw-ov')) return;
  const ov=document.createElement('div'); ov.id='pw-ov'; ov.className=forced?'jr-signin':'modal-ov';
  const card=document.createElement('form'); card.className=forced?'jr-signin-card':'modal-card'; if(!forced) card.style.cssText='max-width:22rem;width:100%';
  card.autocomplete='off';

    <p class="muted">${esc(forced?tx('newPwWhy'):tx('pwRules'))}</p>${forced?`<p class="muted jr-pwrules">${esc(tx('pwRules'))}</p>`:''}
    <label class="field"><span>${esc(tx('curPw'))}</span><input name="cur" type="password" autocomplete="current-password"></label>
    <label class="field"><span>${esc(tx('newPw'))}</span><input name="n1" type="password" autocomplete="new-password"></label>
    <label class="field"><span>${esc(tx('newPw2'))}</span><input name="n2" type="password" autocomplete="new-password"></label>
    <div class="jr-signin-err" role="alert"></div>
    <div class="item-edit-actions">${forced?`<button type="button" class="mini" data-out>${esc(tx('signOut'))}</button>`:`<button type="button" class="mini" data-x>${esc(tx('cancel'))}</button>`}<button class="act" type="submit">${esc(tx('savePw'))}</button></div>`;
  ov.appendChild(card); document.body.appendChild(ov);
  const err=card.querySelector('.jr-signin-err'), go=card.querySelector('[type=submit]');
  if(forced) card.querySelector('[data-out]').onclick=async()=>{ try{ await fetch(jrUrl('/api/logout'),{method:'POST',headers:{'X-Token':TOKEN}}); }catch(_){} jrSetSession('',null); JOURNAL_EVENTS=[]; dismiss(ov); askToken(); };
  else { card.querySelector('[data-x]').onclick=()=>dismiss(ov); ov.onclick=e=>{ if(e.target===ov) dismiss(ov); }; }
  card.onsubmit=async e=>{
    e.preventDefault(); err.textContent='';
    if(card.n1.value!==card.n2.value){ err.textContent=tx('pwNoMatch'); return; }
    go.disabled=true;
    try{
      const r=await fetch(jrUrl('/api/password'),{method:'POST',headers:{'Content-Type':'application/json','X-Token':TOKEN},body:JSON.stringify({current:card.cur.value,password:card.n1.value})});

      <label class="field"><span>${esc(tx('password'))}</span><input name="password" type="password" autocomplete="${up?'new-password':'current-password'}"></label>

      <button class="act" type="submit">${esc(tx('signIn'))}</button>
      <div class="jr-signin-err" role="alert"></div>

    </form>`;
    const f=ov.querySelector('form'), errEl=ov.querySelector('.jr-signin-err'), go=f.querySelector('[type=submit]');

      go.disabled=true; errEl.textContent='';

      +'<button class="act'+(danger?' jr-danger':'')+'" id="ac-yes" style="flex:1">'+esc(yes)+'</button></div></div>';
    document.body.appendChild(ov);
    const done=v=>{ document.removeEventListener('keydown',onKey); dismiss(ov); resolve(v); };

// =================== Yai Calendar ===================
let JOURNAL_EVENTS = [];
let JR_VIEW = localStorage.getItem('sk_journal_view') || 'calendar';
let JR_CAL_YEAR, JR_CAL_MONTH; // 0-based month, like Date's own convention
(function(){ const d=new Date(); JR_CAL_YEAR=d.getFullYear(); JR_CAL_MONTH=d.getMonth(); })();
let JR_SEL = null;   // the selected day (ISO); the bottom panel shows only this day

const jrToday = () => jrISO(new Date());
// Local-calendar-day ISO string — never toISOString(), which is UTC and can
// land on the wrong day near midnight in this timezone.
function jrISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// Dates are written by hand from the language tables (L, above): every toLocaleDateString call builds a
// formatter (the clock alone asked for three a second) and the first one loads the Intl engine.
const p2=n=>String(n).padStart(2,'0');
function jrDayLabel(iso){
  const today=jrToday();
  if(iso===today) return `<span class="rel">${esc(tx('today'))}</span>`;
  const t=new Date(today+'T00:00:00'), d=new Date(iso+'T00:00:00');
  const diffDays=Math.round((d-t)/86400000);
  if(diffDays===1) return `<span class="rel">${esc(tx('tomorrow'))}</span>`;
  if(diffDays===-1) return `<span class="rel">${esc(tx('yesterday'))}</span>`;
  return jrFmtShort(d);   // Sat 10 Oct
}
function jrTimeLabel(t){ return t ? t.slice(0,5) : '—'; }
// for the day squares, where every letter counts: "09:30:00" → "9:30"
function jrShortTime(t){ return t ? t.slice(0,5).replace(/^0(\d)/,'$1') : ''; }
// An event can run from a time to a time, and over several days (end_date). These say where it ends and
// how to write its span; every view uses them, so a multi-day event shows on each day it covers.
const jrEnd=e=>e.end_date && e.end_date>e.event_date ? e.end_date : e.event_date;   // its last day
const jrCovers=(e,iso)=>e.event_date<=iso && iso<=jrEnd(e);
const jrMulti=e=>jrEnd(e)!==e.event_date;
// "9:30–11:00" (short: no leading zero), "" when all day
function jrTimeRange(e, short){
  if(!e.event_time) return '';
  const f=short?jrShortTime:jrTimeLabel;
  return f(e.event_time)+(e.end_time?'–'+f(e.end_time):'');
}
// "20–23 Nov", or "30 Nov – 2 Dec" across months
function jrDateRange(e){
  const a=new Date(e.event_date+'T00:00:00'), b=new Date(jrEnd(e)+'T00:00:00');
  if(a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear())
    return JR_LANG==='zh' ? `${a.getMonth()+1}月${a.getDate()}日–${b.getDate()}日` : `${a.getDate()}–${b.getDate()} ${jrMonShort(a.getMonth())}`;
  return `${jrFmtDM(a)} – ${jrFmtDM(b)}`;
}
const jrDays=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
function jrAddDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return jrISO(d); }
// A multi-day event's details on one day: that day's own, else the event's (a field left out is the event's)
function jrDay(e, iso){
  const o=e.day_info?.[iso]||{}, t=o.event_time||e.event_time||null; let t2=o.end_time||e.end_time||null;
  if(t2 && (!t || t2<=t)) t2=null;                                  // an end that no longer follows its start is dropped
  return {event_time:t, end_time:t2, location:o.location||e.location||null, notes:o.notes||e.notes||null, people:o.people||e.people||[]};
}
// the same details moved n days (the whole event dragged, or its dates shifted in the form)
function jrShiftDays(di, n){ const o={}; for(const k in di||{}) o[jrAddDays(k,n)]=di[k]; return o; }
// A place opens in Google Maps (the Maps app on a phone that has it): a pasted Maps link as it is, a place name
// as a Maps search. A link shows as "Map" rather than as a long address.
const jrIsLink=loc=>/^https?:\/\//i.test(loc||'');
const jrMapUrl=loc=>jrIsLink(loc) ? loc : 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc);
const jrPlace=loc=>jrIsLink(loc) ? tx('mapWord') : loc;
function jrMapLink(loc, cls=''){
  return `<a class="jr-map ${cls}" href="${esc(jrMapUrl(loc))}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="${esc(tx('openMaps'))}">${JR_PIN}${esc(jrPlace(loc))}</a>`;
}
// Event colours: the theme's own eight, so they suit whichever theme is on. An event with no colour of its own gets
// one from its id — a mix across the calendar, and the same one on every device and after every reload.
const JR_COLORS={blue:'--c-blue', green:'--c-green', yellow:'--c-yellow', orange:'--c-orange', red:'--c-red', purple:'--c-purple', teal:'--c-teal', sky:'--c-sky'};
const JR_COLOR_NAMES=Object.keys(JR_COLORS);
function jrColor(e){ if(e.color && JR_COLORS[e.color]) return e.color; let h=e.id*2654435761>>>0; return JR_COLOR_NAMES[h%JR_COLOR_NAMES.length]; }
// the style that tints an event's chip, bar, card, row or pop-up: every event rule reads --accent / --k-act
// --k-act: the light fill; --accent: its dark shade, for words, times and edges
const jrTint=e=>{ const k=JR_COLORS[jrColor(e)]; return `--accent:var(${k}-ink);--k-act:var(${k})`; };
const JR_PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>';

// The month and the day are drawn straight away; the events fill in when they arrive, so a slow or

// ---- the team (the organisation chart): who should attend an event ----
// Kept in the database (it's staff names and photos, so never in the page's files); a copy stays on this device

let JR_PEOPLE=[]; try{ JR_PEOPLE=JSON.parse(localStorage.getItem('yai_people'))||[]; }catch(_){}

// a nickname (set by editors) stands in for the full name; the short form is the nickname, else the first name

const jrInitials=n=>String(n).trim().split(/\s+/).slice(0,2).map(w=>Array.from(w)[0]||'').join('').toUpperCase();
// a round photo over its initials: if the photo is missing or fails, the initials show (a colour from the code)
function jrAvatar(p){

  return `<span class="jr-av" style="--h:${h}" title="${esc(jrPName(p))}${p.nickname?' ('+esc(p.name)+')':''}${p.role?' · '+esc(p.role):''}"><b>${esc(jrInitials(jrPName(p)))}</b>${p.photo?`<img src="${esc(p.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</span>`;
}
const jrAttendees=(e,iso)=>((iso&&jrMulti(e)?jrDay(e,iso).people:e.people)||[]).map(jrPerson).filter(Boolean);   // a multi-day event's day can have its own list
// avatars side by side, overlapping, with "+n" past the first few
function jrAvStack(e, max=4, iso){

  return `<span class="jr-avs">${l.slice(0,max).map(jrAvatar).join('')}${l.length>max?`<span class="jr-av more">+${l.length-max}</span>`:''}</span>`;

// ---- Add events from a photo, free and on this device ----
// The photo is turned to text with Tesseract (open-source OCR, loaded the first time it's used), then patterns find the dates,
// times, place and title (jrParseEvents). The events are shown for checking and editing; nothing is saved until "Add".
// Nothing is sent anywhere, and no account or key is needed. It reads clean, printed text best: a flat, well-lit photo.
// lines: [{text, h}] top to bottom (h: how tall the letters are, so the biggest line can be the title); today: 'YYYY-MM-DD'
function jrParseEvents(lines, today){
  const KD='០១២៣៤៥６７８９'; 
  const norm=t=>String(t||'').replace(/[០-៩]/g,c=>'០១២៣៤៥៦៧៨៩'.indexOf(c)).replace(/[０-９]/g,c=>String(c.charCodeAt(0)-0xFF10)).replace(/[：]/g,':').replace(/[–—−~～]/g,'-').replace(/\s+/g,' ').replace(/(?<=[\u3400-\u9fff\uff08\uff09\u3001\u3002\uff0c])\s+(?=[\u3400-\u9fff\uff08\uff09])/g,'').trim();   // OCR puts spaces between Chinese characters
  const EN=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const KM=['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];
  const monthOf=w=>{ w=w.toLowerCase(); let i=EN.findIndex(m=>w.startsWith(m)); if(i>=0) return i+1; i=KM.findIndex(m=>w.includes(m)); return i>=0?i+1:0; };
  const MN='(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?|'+KM.join('|')+')';
  const pad=n=>String(n).padStart(2,'0');
  const valid=(y,m,d)=>{ const t=new Date(Date.UTC(y,m-1,d)); return m>=1&&m<=12&&d>=1&&d<=31&&t.getUTCMonth()===m-1&&t.getUTCDate()===d; };
  const ty=+today.slice(0,4);
  // no year written: the first such date on or after today
  const fill=(y,m,d)=>{ if(y) return y<100?2000+y:y; return valid(ty,m,d)&&`${ty}-${pad(m)}-${pad(d)}`>=today?ty:ty+1; };
  const iso=(y,m,d)=>{ const yy=fill(y,m,d); return valid(yy,m,d)?`${yy}-${pad(m)}-${pad(d)}`:null; };

  const rows=lines.map(l=>({raw:l.text, t:norm(l.text), h:l.h||0})).filter(r=>r.t);
  const found=[];                                     // {from,to?, row, text} one per date or range
  const used=rows.map(()=>[]);                        // pieces of each row taken as date/time/place, to drop from the title and notes

// a photo made easier to read: upright, big enough (letters ~30px tall read best), grey, with the contrast stretched

          const saved=await api('/api/journal/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:e.title.trim(),event_date:e.event_date,end_date:end,event_time:e.event_time||null,end_time:t2,
            location:(e.location||'').trim()||null,notes:(e.notes||'').trim()||null,category:(e.category||'').trim()||null})});
          JOURNAL_EVENTS.push(saved); added++; last=saved;
        }catch(err){ toast(tx('errPrefix')+jrErr(err.message)); }
      }
      close(); if(added){ toast(tx('scanAdded',{n:added})); if(JR_VIEW==='calendar'&&last) calSelect(last.event_date); else jrRender(); jrRenderUpNext(); }
    }
    draw();
  }
  start();
}

// Desktop side menu: everything from today on, in date order, under month and day headings — the Agenda in
// brief. Clicking one opens that day in the calendar. (Phones hide it: there the menu is a bar.)
let JR_UPNEXT_SIG='';
function jrRenderUpNext(){
  const box=document.getElementById('jr-upnext'); if(!box) return;
  const today=jrToday();
  // listed under its first day, or under today while it's still running
  const at=e=>e.event_date<today?today:e.event_date;
  const evs=JOURNAL_EVENTS.filter(e=>jrEnd(e)>=today)
    .sort((a,b)=>at(a).localeCompare(at(b)) || jrMulti(b)-jrMulti(a) || jrByTime(a,b)).slice(0,60);
  const sig=JSON.stringify([today,JR_SEL,evs]); if(sig===JR_UPNEXT_SIG) return; JR_UPNEXT_SIG=sig;   // nothing new: leave it be
  if(!evs.length){ box.innerHTML=`<div class="jr-up-head">${esc(tx('comingUp'))}</div><div class="jr-up-empty">${esc(tx('nothingYet'))}</div>`; return; }
  let html=`<div class="jr-up-head">${esc(tx('comingUp'))}</div>`, month='', day='', n=0;
  for(const e of evs){
    const iso=at(e), d=new Date(iso+'T00:00:00'), m=jrFmtMY(d);
    if(m!==month){ month=m; html+=`<div class="jr-up-month">${esc(m)}</div>`; }
    if(iso!==day){
      day=iso;
      const rel=iso===today?tx('today'):(Math.round((d-new Date(today+'T00:00:00'))/86400000)===1?tx('tomorrow'):'');
      html+=`<div class="jr-up-day${day===JR_SEL?' sel':''}" style="--i:${n}"><b>${d.getDate()}</b><span>${jrDayAbbr(d.getDay())}${rel?` · <em>${esc(rel)}</em>`:''}</span></div>`;
    }
    const more=[jrMulti(e)?`<em>${jrDateRange(e)}</em>`:'', e.location?`<span class="jr-up-loc" role="link" title="${esc(tx('openMaps'))}" onclick="event.stopPropagation();open(jrMapUrl(${esc(JSON.stringify(e.location))}),'_blank','noopener')">${JR_PIN}${esc(jrPlace(e.location))}</span>`:'',
      e.category?`<i>${esc(e.category)}</i>`:'', e.created_by?`<b>${esc(e.created_by)}</b>`:'', e.notes?esc(e.notes):''].filter(Boolean).join('');
    html+=`<button type="button" class="jr-up-ev${e.done?' done':''}" style="--i:${n++};${jrTint(e)}" onclick="jrUpOpen('${iso}',${e.id})">
      <span class="jr-up-time">${jrTimeRange(e,true)||(jrMulti(e)?tx('multiDay'):tx('allDay'))}</span>
      <span class="jr-up-title">${esc(e.title)}</span>
      ${more?`<span class="jr-up-more">${more}</span>`:''}
      ${jrAttendees(e,iso).length?`<span class="jr-up-ppl">${jrAvStack(e,5,iso)}</span>`:''}
    </button>`;
  }
  box.innerHTML=html;
}

// A card folding shut: fades, slides right and closes its gap, then the caller re-renders.
function jrFold(el){
  if(!el || !el.animate || K_REDUCED.matches) return Promise.resolve();
  el.classList.add('leaving');
  // a day card sits in a row, so it folds sideways; an agenda row folds up
  if(el.closest('.jr-day-list')){
    const w=el.offsetWidth;
    return el.animate([{opacity:1,transform:'none',maxWidth:w+'px',flexBasis:w+'px'},
      {opacity:0,transform:'translateY(18px) scale(.94)',maxWidth:w+'px',flexBasis:w+'px',offset:.55},
      {opacity:0,transform:'translateY(18px) scale(.94)',maxWidth:'0px',flexBasis:'0px',paddingLeft:'0px',paddingRight:'0px',marginRight:'-.55rem',borderWidth:'0px'}],
      {duration:340,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished.catch(()=>{});
  }
  const h=el.offsetHeight;
  return el.animate([{opacity:1,transform:'none',height:h+'px'},{opacity:0,transform:'translateX(24px)',height:h+'px',offset:.55},
    {opacity:0,transform:'translateX(24px)',height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'-.55rem',borderWidth:'0px'}],
    {duration:340,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished.catch(()=>{});
}
function jrEvent(id){ return JOURNAL_EVENTS.find(e=>e.id===id); }

// every part of an event edits in the one form, opened at the part that was tapped

async function toggleEventDone(id){
  const e=jrEvent(id); if(!e || jrJustSwiped()) return;
  try{
    const updated=await api('/api/journal/events/'+id+'/done',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:!e.done})});
    const i=JOURNAL_EVENTS.findIndex(x=>x.id===id); if(i>=0) JOURNAL_EVENTS[i]=updated;
    jrRender();
    if(updated.done && !K_REDUCED.matches){
      const c=document.querySelector(`.jr-dcard[data-id="${id}"]`);
      c?.querySelector('.ok')?.classList.add('tick'); c?.classList.add('just-done');
    }
  }catch(err){ toast(tx('errPrefix')+jrErr(err.message)); }
}
async function deleteEventRow(id){
  const e=jrEvent(id); if(!e || jrJustSwiped()) return;
  if(!await askConfirm(tx('confirmDelete',{title:e.title}), tx('del'), true)) return;
  try{
    await api('/api/journal/events/'+id,{method:'DELETE'});

// Lays out the titles in the day squares. Runs after every render and whenever the grid changes size.
// A one-day event stays inside its own day: a long title wraps onto more lines (between words), and ends "…"
// when the square has no more room — it never runs into the next days, where it would look like it lasts
// longer. Only a multi-day event's bar crosses days, locked to the days it covers. Each week is filled in rows
// ("lanes"), left to right: a bar running into later days keeps its lane there, so those days' own titles go
// below it. Titles that don't fit a square's height become "+N".
function jrFitCells(){

}

// Events this device kept on its own before it had a shared backend (the GitHub site's local mode).
// Once a backend answers, offer them to it once. The device keeps its copy either way.
async function jrOfferLocalEvents(){

  const doneKey='journal_local_offered:'+JR_API;
  if(!local.length || localStorage.getItem(doneKey)) return;
